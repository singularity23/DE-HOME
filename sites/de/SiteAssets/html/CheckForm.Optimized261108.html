        return Array.from(document.querySelectorAll('.required-field-underline')).reduce((acc, el) => {

          const isValid = this.#isUnderlineHidden(el);
          if (highlightInvalid) {
            const label = el.parentElement.querySelector('.field-label') ? el.parentElement.querySelector('.field-label') : el.closest('.sig-cell-sub').querySelector('.field-label');
            console.log(label);
            const curColor = label ? label.style.color : '';
            if (label) {
              label.style.color = isValid ? '' : '#d32f2f';
              setTimeout(() => {
                label.style.color = curColor;
              }, DURATION); // reset color after 3 seconds
            }
          }
          return acc && isValid;
        }, true);
      }

      /**
       * Mirrors the CSS rules that hide the required-field underline, without reading computed
       * styles (which would force layout). Hidden means: the field is not applicable or is valid.
       * @param {Element} el An underline element.
       * @returns {boolean} True when the field counts as valid.
       */
      #isUnderlineHidden (el) {
        if (el.closest('.hidden')) return true; // card hidden
        if (el.closest('.sec-body:not(.open)')) return true; // section collapsed
        const ctrl = el.previousElementSibling;
        if (!ctrl) return true;
        if (ctrl.disabled) return true; // disabled -> not required
        if (ctrl.classList?.contains('role-selector')) return !!ctrl.querySelector('input[type="radio"]:checked');
        if (ctrl.classList?.contains('risk-row')) return !!ctrl.querySelector('.risk-btn.active');
        if (ctrl.tagName === 'INPUT' || ctrl.tagName === 'SELECT' || ctrl.tagName === 'TEXTAREA') {
          return ctrl.validity.valid;
        }
        return true;
      }

      /**
       * Announces and toasts the "form not ready" message.
       * @returns {void}
       */
      #notReadyMessage () {
        this.showValidationMessage('Not all required fields are filled / Not all check questions are answered or answered correctly.');
        this.showToast(
          'Not all <b>required (Red Underlines)</b> fields are filled / Not all check questions are answered or answered correctly.',
          'error'
        );
      }

      /**
       * Handles the form's submit event: validates and shows a message when not ready.
       * @returns {void}
       */
      handleSubmitAttempt () {
        this.updateProgress();
        if (!(this.allRequiredFieldsValid() && this.elements.progressBar.value === 100)) this.#notReadyMessage();
      }

      /**
       * Checks that the form can be exported to PDF.
       * Requires: all required fields valid, 100% progress, open sections' signatures unlocked,
       * and no risk inconsistencies.
       * @returns {boolean} True when export may proceed.
       */
      pdfValidation () {
        this.updateProgress();
        if (
          !this.allRequiredFieldsValid(true) ||
          this.elements.progressBar.value !== 100 ||
          !this.#sig.allOpenEnabled() ||
          this.#inconsistent
        ) {
          this.#notReadyMessage();
          return false;
        }
        return true;
      }

      // ---------- Clear section ----------

      /**
       * Clears one section's fields, answers, and signatures, then refreshes dependent state.
       * @param {string} sectionId Id of the section body ("s1", "s2", ..., or "sec-info-body").
       * @returns {void}
       */
      clearSection (sectionId) {
        const sec = getById(sectionId);
        if (!sec) return;
        this.clearFormControls(sec);
        this.restoreDefaults(sec);
        this.#hydrateFormStateFromDom();

        if (sec.contains(this.elements.scRoleEng)) this.updateRoleLabels(true);
        if (sectionId === 's3') this.#sig.setEnabled('ch', false);
        if (sectionId === 's4') this.#sig.setEnabled('pr', false);
        if (sectionId === 's5') this.#sig.setEnabled('ir', false);
        if (sectionId === 's6') this.#sig.setEnabled('fT1', false);

        this.showRiskConsistencyNotices();
        this.syncSectionVisibility();
        this.updateProgress();
        this.#comments.syncHeights();
        this.syncCssStateClasses();
        this.showToast('Section cleared', 'info');
      }

      /**
       * Resets all inputs, selects, risk buttons, signatures, and comments inside a root.
       * @param {ParentNode} root Section or document.
       * @returns {void}
       */
      clearFormControls (root) {
        root.querySelectorAll('input[type="radio"]').forEach(r => {
          r.checked = false;
        });
        root
          .querySelectorAll(
            'input[type="text"], input[type="number"], input[type="date"], input[type="hidden"],   input[type = "file"]'
          )
          .forEach(i => {
            i.value = '';
          });
        root.querySelectorAll('select').forEach(s => {
          s.selectedIndex = 0;
        });
        root.querySelectorAll('textarea').forEach(t => {
          t.value = '';
        });
        root.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
        root.querySelectorAll('.sig-draw-surface').forEach(el => el.classList.remove('has-signature'));
        this.#comments.clearContent(root);
        this.#comments.clearGalleries(root);
        this.#comments.syncAllHidden();
        this.syncCssStateClasses();
      }

      /**
       * Restores the revision and role defaults, but only if they live inside the cleared root.
       * @param {ParentNode} [root=document] Cleared root.
       * @returns {void}
       */
      restoreDefaults (root = document) {
        if (root.contains(this.elements.revision)) this.elements.revision.value = '0';
        if (root.contains(this.elements.scRoleEng)) this.elements.scRoleEng.checked = true;
      }

      // ---------- Toast ----------

      /**
       * Hides the global notice.
       * @returns {void}
       */
      hideToast () {
        this.#toast.hide();
      }

      /**
       * Shows a message in the global notice.
       * @param {string} msg Message (HTML allowed).
       * @param {'info'|'success'|'error'|'warn'} [type='info'] Style variant.
       * @returns {void}
       */
      showToast (msg, type = 'info') {
        this.#toast.show(msg, type);
      }

      // ---------- CSS state classes ----------

      /**
       * Mirrors DOM state into CSS classes so stylesheets do not need :has() selectors.
       * @returns {void}
       */
      syncCssStateClasses () {
        document.querySelectorAll('.sec-right').forEach(el => {
          el.classList.toggle('has-role-selector', !!el.querySelector('.role-selector'));
        });
        document.querySelectorAll('.meta-cell').forEach(el => {
          el.classList.toggle('is-disabled', !!el.querySelector('input:disabled, select:disabled, textarea:disabled'));
        });
        document.querySelectorAll('.comments-area').forEach(el => {
          el.classList.toggle('has-fallback-editor', !!el.querySelector('.comments-editor-fallback'));
        });
      }

      // ---------- Reset ----------

      /**
       * Resets the entire form after the user confirms.
       * @returns {void}
       */
      resetForm () {
        if (!confirm('Reset entire form? All data will be lost.')) return;
        this.clearFormControls(document);
        this.restoreDefaults();
        this.#hydrateFormStateFromDom();
        this.updateRoleLabels(true);
        this.showRiskConsistencyNotices();
        this.updateProgress();
        this.#comments.syncHeights();
        this.syncCssStateClasses();
        this.showToast('Form reset', 'info');
      }

      // ============================================================
      // 9. PDF export
      // ============================================================

      // --- 1. PDF-Lib signature field injection ---

      /**
       * Adds empty, clickable digital-signature fields to the generated PDF.
       * pdfmake cannot create form fields, so pdf-lib post-processes the file: it adds a
       * signature widget annotation per recorded position and registers them in the AcroForm.
       *
       * Coordinate note: pdfmake measures `top` from the top of the page, but the PDF format
       * measures `y` from the bottom. A rectangle's bottom edge is therefore
       *   y = pageHeight - top - height
       * and the PDF Rect is [left, y, left + width, y + height].
       * @param {Uint8Array} pdfBytes PDF generated by pdfmake.
       * @returns {Promise<Uint8Array>} PDF bytes with signature fields.
       */
      async #addSignatureFields (pdfBytes) {
        if (!this.#sigFields.length) return pdfBytes;
        try {
          if (!window.PDFLib?.PDFDocument) {
            await loadCdnAsset('PDFLIB_JS', 'script', 30000, () =>
              Boolean(window.PDFLib?.PDFDocument && window.PDFLib?.PDFName && window.PDFLib?.PDFString)
            );
          }
          const { PDFDocument, PDFName, PDFString } = window.PDFLib;

          const doc = await PDFDocument.load(pdfBytes);
          const ctx = doc.context;
          const pages = doc.getPages();
          const widgetRefs = [];

          // pdfmake may lay a node out more than once; keep the last position per field
          const fields = new Map(this.#sigFields.map(sig => [sig.name, sig]));
          for (const sig of fields.values()) {
            const page = pages[sig.page - 1];
            if (!page) continue;
            const y = page.getHeight() - sig.top - sig.height; // flip from top-based to bottom-based coordinates
            const widget = ctx.obj({
              Type: 'Annot',
              Subtype: 'Widget',
              FT: 'Sig',
              T: PDFString.of(sig.name),
              TU: PDFString.of(sig.tooltip),
              F: 4, // Print flag
              Rect: [sig.left, y, sig.left + sig.width, y + sig.height],
              P: page.ref,
            });
            const ref = ctx.register(widget);
            page.node.addAnnot(ref);
            widgetRefs.push(ref);
          }

          if (widgetRefs.length > 0) {
            // SigFlags 1 = SignaturesExist.
            const acroForm = ctx.obj({ Fields: ctx.obj(widgetRefs), SigFlags: 1 });
            doc.catalog.set(PDFName.of('AcroForm'), ctx.register(acroForm));
          }
          return await doc.save();
        } catch (error) {
          throw new Error('Could not add PDF signature fields.', { cause: error });
        }
      }

      // --- 2. Main export handler ---

      /**
       * Validates the form, builds the PDF, adds signature fields, and downloads the file.
       * @returns {Promise<void>}
       */
      async exportPdf () {
        if (!this.pdfValidation()) return;
        const button = this.elements.exportPdf;
        if (!button || button.disabled) return;

        button.disabled = true;
        const buttonText = query('.button-text', button);
        const originalText = buttonText?.textContent || 'Save PDF';
        if (buttonText) buttonText.textContent = 'Preparing PDF…';

        try {
          this.#comments.syncAllHidden();
          if (!window.pdfMake?.createPdf)
            await loadCdnAsset('PDFMAKE_JS', 'script', 30000, () => typeof window.pdfMake?.createPdf === 'function');
          if (!window.pdfMake?.createPdf) throw new Error('PDF library failed to load.');
          if (!pdfMakeFontsLoaded) {
            await loadCdnAsset('PDFMAKE_FONTS_JS', 'script', 30000);
            pdfMakeFontsLoaded = true;
          }

          const definition = await this.#buildPdfDefinition();
          // File name: the work title with characters that are illegal in file names replaced by "-".
          const title =
            getById('workTitle')
              ?.value.trim()
              .replace(/[\\/:*?"<>|]+/g, '-')
              .slice(0, 80) || 'DE_CheckForm';

          const pdfBytes = await new Promise((resolve, reject) => {
            try {
              window.pdfMake.createPdf(definition).getBuffer(resolve);
            } catch (err) {
              reject(err);
            }
          });

          const finalBytes = await this.#addSignatureFields(pdfBytes);
          const url = URL.createObjectURL(new Blob([finalBytes], { type: 'application/pdf' }));
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = `${title}.pdf`;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          this.showToast('PDF saved successfully', 'success');
        } catch (error) {
          console.error('PDF export failed:', error);
          const message =
            error instanceof Error && (error.message.includes('screenshot') || error.message.includes('PDF signature fields'))
              ? error.message
              : 'Could not create the PDF. Please try again.';
          this.showToast(message, 'error');
        } finally {
          button.disabled = false;
          if (buttonText) buttonText.textContent = originalText;
        }
      }

      // --- 3. PDF definition builder ---

      /**
       * Returns a section's signature image prepared for the PDF, or '' when unsigned.
       * @param {string} prefix Section prefix.
       * @returns {Promise<string>} PNG data URL.
       */
      async #signatureForPdf (prefix) {
        const dataUrl = getById(`${prefix}_sig_data`)?.value || '';
        if (!dataUrl) return '';
        // Signatures render at 120×40 pt; 480 px wide is 4x that, enough for print. Keep PNG for transparency.
        return this.#imageForPdf(dataUrl, `${prefix} signature`, { maxWidth: 480 });
      }

      /**
       * Decodes an image, scales it down to at most `maxWidth` pixels wide, and re-encodes it.
       *
       * Scale factor: scale = min(1, maxWidth / naturalWidth). The `min(1, ...)` means images
       * are only shrunk, never enlarged. Height follows the same scale to keep the aspect ratio.
       * JPEG has no transparency, so a white background is painted first for JPEG output.
       * @param {string} dataUrl Source image data URL.
       * @param {string} description Name used in error messages.
       * @param {{maxWidth?: number, type?: string}} [opts] Max width in px (default 1200) and output MIME type (default image/png).
       * @returns {Promise<string>} Re-encoded data URL (quality 0.85 for JPEG).
       */
      async #imageForPdf (dataUrl, description, { maxWidth = 1200, type = 'image/png' } = {}) {
        const image = new Image();
        image.src = dataUrl;
        try {
          await image.decode();
        } catch {
          throw new Error(`Could not read the ${description} image.`);
        }
        const scale = Math.min(1, maxWidth / image.naturalWidth);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        const context = canvas.getContext('2d');
        if (!context) throw new Error(`Could not process the ${description} image.`);
        if (type === 'image/jpeg') {
          context.fillStyle = '#fff';
          context.fillRect(0, 0, canvas.width, canvas.height);
        }
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL(type, 0.85);
      }

      /**
       * Tells whether a section card is shown and expanded (so it belongs in the PDF).
       * @param {string} cardId Card element id.
       * @returns {boolean}
       */
      #isPdfCardVisible (cardId) {
        const card = getById(cardId);
        if (!card || card.closest('.hidden, [hidden], .sec-body:not(.open)')) return false;
        const head = card.querySelector(':scope > .sec-head');
        const body = head && getById(head.getAttribute('aria-controls'));
        return Boolean(head?.classList.contains('open') && body?.classList.contains('open'));
      }

      /**
       * Converts a comment box into pdfmake content: text runs with bold / italic / underline /
       * links, ordered and bullet lists, and embedded images.
       * @param {string} id Hidden field id of the comment box.
       * @returns {Promise<Array<Object>>} pdfmake content blocks (empty when there is no content).
       */
      async #commentContent (id) {
        const container = getById(`${id}-editor`);
        let source = container?.matches('.comments-inline-editor') ? container : container?.querySelector('.ql-editor');
        if (!source || (!(source.innerText || source.textContent || '').trim() && !source.querySelector('img[src]'))) {
          source = document.createElement('div');
          source.innerHTML = sanitizeHtml(getById(id)?.value || '');
        }

        const content = [];
        let imageIndex = 0;
        const hasEditorContent = Boolean((source.innerText || source.textContent || '').trim() || source.querySelector('img[src]'));

        /** Converts an <img> to a pdfmake image block, fitted inside 230 x 180 pt. Only embedded images are allowed. */
        const pdfImage = async image => {
          const src = image.getAttribute('src') || '';
          imageIndex += 1;
          if (!SAFE_DATA_IMAGE.test(src)) {
            throw new Error(`The ${id} screenshot ${imageIndex} is not an embedded image. Paste it into the editor and
            try again.`);
          }
          return {
            image: await this.#imageForPdf(src, `${id} screenshot ${imageIndex}`, {
              maxWidth: 1000,
              type: 'image/jpeg',
            }),
            fit: [230, 180],
            margin: [0, 3, 0, 3],
          };
        };

        /** Adds the formatting that an element contributes (bold, italics, underline, safe link) to inherited marks. */
        const marksFor = (element, inherited) => {
          const marks = { ...inherited };
          if (element.matches('strong, b')) marks.bold = true;
          if (element.matches('em, i')) marks.italics = true;
          if (element.matches('u')) marks.decoration = 'underline';
          const href = element.getAttribute('href') || '';
          if (element.matches('a[href]') && href && isSafeUrl(href)) {
            marks.link = href;
            marks.color = '#0563C1';
            marks.decoration = 'underline';
          }
          return marks;
        };

        /**
         * Converts inline nodes to pdfmake blocks. Text and inline elements collect into one
         * paragraph; an image ends the current paragraph and becomes its own block.
         */
        const inlineContent = async (nodes, prefix = '') => {
          const blocks = [];
          let runs = prefix ? [{ text: prefix }] : [];
          /** Emits the collected runs as one paragraph. */
          const flush = () => {
            if (!runs.length) return;
            blocks.push({ text: runs, style: 'commentValue', margin: [0, 0, 0, 3] });
            runs = [];
          };
          /** Walks a node, carrying the active text marks down to its children. */
          const visit = async (node, marks = {}) => {
            if (node.nodeType === Node.TEXT_NODE) {
              if (node.nodeValue) {
                runs.push({ text: node.nodeValue, ...marks });
              }
              return;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return;
            if (node.matches('img[src]')) {
              flush();
              blocks.push(await pdfImage(node));
              return;
            }
            if (node.matches('br')) {
              runs.push({ text: '\n', ...marks });
              return;
            }
            const nextMarks = marksFor(node, marks);
            for (const child of node.childNodes) await visit(child, nextMarks);
          };
          for (const node of nodes) await visit(node);
          flush();
          return blocks;
        };

        /**
         * Converts a block-level node. Lists get a "• " or "N. " prefix and a left indent of
         * 12 pt per Quill indent level (indent = level * 12).
         */
        const renderBlocks = async node => {
          if (node.nodeType === Node.TEXT_NODE) {
            return node.nodeValue?.trim() ? inlineContent([node]) : [];
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return [];
          if (node.matches('ol, ul')) {
            const rendered = [];
            let number = 0;
            for (const item of [...node.children].filter(child => child.matches('li'))) {
              number += 1;
              const isBullet = item.getAttribute('data-list') === 'bullet' || node.matches('ul');
              const indent = [...item.classList].map(className => /^ql-indent-(\d+)$/.exec(className)).find(Boolean);
              const prefix = isBullet ? '\u2022 ' : `${number}. `;
              const inlineNodes = [...item.childNodes].filter(
                child =>
                  !(child.nodeType === Node.ELEMENT_NODE && child.matches('ol, ul')) &&
                  !(child.nodeType === Node.ELEMENT_NODE && child.matches('.ql-ui'))
              );
              const itemBlocks = await inlineContent(inlineNodes, prefix);
              const leftIndent = indent ? Number(indent[1]) * 12 : 0;
              itemBlocks.forEach(block => {
                if (block.margin) block.margin[0] = leftIndent;
              });
              rendered.push(...itemBlocks);
              for (const nested of [...item.children].filter(child => child.matches('ol, ul'))) {
                rendered.push(...(await renderBlocks(nested)));
              }
            }
            return rendered;
          }
          if (node.matches('p, div')) return inlineContent(node.childNodes);
          if (node.matches('img[src]')) return [await pdfImage(node)];
          return inlineContent([node]);
        };

        if (hasEditorContent) {
          for (const child of source.childNodes) content.push(...(await renderBlocks(child)));
        }
        const galleryImages = [...(getById(`${id}-gallery`)?.querySelectorAll('.image-thumbnail img[src]') || [])];
        if (!source.querySelector('img[src]')) {
          for (const image of galleryImages) content.push(await pdfImage(image));
        }
        return content;
      }

      /**
       * Reads the form into a plain object used to build the PDF.
       * Only sections that are visible are read; hidden ones get empty signatures and comments.
       * @param {Object<string, boolean>} visible Section visibility by key (info, sc, ds, ch, pr, ir, fT1).
       * @returns {Promise<Object>} Data object grouped by section.
       */
      async #collectPdfData (visible) {
        /** Trimmed value of an input by id. */
        const value = id => getById(id)?.value?.trim() || '';
        /** Value of a Work Info field, or null when its cell is disabled (so it is omitted from the PDF). */
        const enabledMetaValue = id => (getById(id)?.closest('.meta-cell.is-disabled') ? null : value(id));
        /** Selected value of a radio group. */
        const checked = name => query(`input[name="${name}"]:checked`)?.value || '';
        /** Display text for a yes / no / na radio group. */
        const answer = name => ({ yes: 'Yes', no: 'No', na: 'N/A' }[checked(name)] || '');
        /** Question and answer text for every row of a section. */
        const checklist = prefix =>
          [...(getById(`${prefix}-rows`)?.querySelectorAll('.check-row') || [])].map(row => {
            const selected = row.querySelector('input[type="radio"]:checked');
            return {
              question: row.querySelector('.check-text')?.textContent.trim() || '',
              answer: selected
                ? query(`label[for="${CSS.escape(selected.id)}"]`, row)?.textContent.trim() || selected.value
                : 'Not answered',
            };
          });

        const signatures = await Promise.all(CONFIG.SIG_PREFIXES.map(prefix => (visible[prefix] ? this.#signatureForPdf(prefix) : '')));
        const sigOf = Object.fromEntries(CONFIG.SIG_PREFIXES.map((prefix, i) => [prefix, signatures[i]]));
        // Which section each comment box belongs to (decides whether it is exported).
        const commentSections = {
          checkerComments: 'ch',
          engineerResponse: 'ch',
          reviewerComments: 'pr',
          engineerResponse_2: 'pr',
          ind_reviewerComments: 'ir',
          ind_engineerResponse_2: 'ir',
        };
        const commentPairs = await Promise.all(
          CONFIG.COMMENT_FIELDS.map(async ([id]) => [id, visible[commentSections[id]] ? await this.#commentContent(id) : []])
        );
        const comments = Object.fromEntries(commentPairs);

        return {
          workInfo: {
            title: value('workTitle'),
            revision: value('revision'),
            role: checked('sc_role'),
            riskLevel: query('.risk-btn.active')?.textContent.trim() || '',
            deliverable: value('deliverable'),
            minCheckLevel: value('minCheckLevel'),
            engineer: value('engineer'),
            directSupervisor: enabledMetaValue('direct-supervisor'),
            checker: enabledMetaValue('checker'),
          },
          selfCheck: {
            checklist: checklist('sc'),
            name: value('sc-name'),
            date: value('sc_date'),
            signature: sigOf.sc,
          },
          directSupervision: {
            checklist: checklist('ds'),
            supervisor: enabledMetaValue('direct-supervisor'),
          },
          check: {
            checklist: checklist('ch'),
            name: value('ch-name'),
            date: value('ch_date'),
            signature: sigOf.ch,
            comments: comments.checkerComments,
            response: comments.engineerResponse,
            addressed: answer('ch_c'),
          },
          peerReview: {
            checklist: checklist('pr'),
            name: value('pr_name'),
            date: value('pr_date'),
            signature: sigOf.pr,
            comments: comments.reviewerComments,
            response: comments.engineerResponse_2,
            addressed: answer('pr_c'),
          },
          independentReview: {
            checklist: checklist('ir'),
            name: value('ir_name'),
            date: value('ir_date'),
            signature: sigOf.ir,
            comments: comments.ind_reviewerComments,
            response: comments.ind_engineerResponse_2,
            addressed: answer('ir_c'),
          },
          tier1Reviewer: {
            date: value('fT1_date'),
            assignedReviewer: value('fT1_name'),
            tlSignature: sigOf.fT1,
          },
        };
      }

      /**
       * Builds the pdfmake document definition: A4 page, styles, content sections, and the
       * `pageBreakBefore` callback that keeps tables together and records signature-field positions.
       * @returns {Promise<Object>} pdfmake document definition.
       */
      async #buildPdfDefinition () {
        const visible = Object.fromEntries(
          [
            ['info', 'card-info'],
            ['sc', 'card-sc'],
            ['ds', 'card-ds'],
            ['ch', 'card-ch'],
            ['pr', 'card-pr'],
            ['ir', 'card-ir'],
            ['fT1', 'card-final'],
          ].map(([key, cardId]) => [key, this.#isPdfCardVisible(cardId)])
        );
        const [data, logo] = await Promise.all([this.#collectPdfData(visible), this.#logoDataUrl()]);
        this.#sigFields = [];
        this.#sigTooltips = {};

        const content = [this.#buildFormHeader(logo)];
        if (visible.info) content.push(this.#buildWorkInfoSection(data.workInfo));
        if (visible.sc) content.push(this.#buildSelfCheckSection(data.selfCheck, visible.ds ? data.directSupervision : null));
        if (visible.ch) content.push(this.#buildCheckSection(data.check));
        if (visible.pr) content.push(this.#buildPeerReviewSection(data.peerReview));
        if (visible.ir) content.push(this.#buildIndependentReviewSection(data.independentReview));
        if (visible.fT1) content.push(this.#buildTier1Section(data.tier1Reviewer));

        return {
          pageSize: 'A4',
          pageMargins: [40, 40, 40, 40],
          content,
          styles: {
            header: { fontSize: 16, bold: true, color: '#0074a4', margin: [0, 0, 0, 10] },
            subheader: { fontSize: 14, bold: true, color: '#046a38', margin: [0, 15, 0, 5] },
            sectionTitle: { fontSize: 12, bold: true, fillColor: '#E8F0FE', margin: [0, 10, 0, 5] },
            label: { bold: true, fontSize: 10, color: '#333333' },
            value: { fontSize: 10, color: '#000000' },
            commentValue: { fontSize: 10, color: '#000000', lineHeight: 1.3 },
            warning: { fontSize: 9, italics: true, color: '#fa4616', margin: [0, 5, 0, 5] },
            tableHeader: { bold: true, fontSize: 10, color: '#ffffff', fillColor: '#05a1c6' },
          },
          defaultStyle: { font: 'Roboto', fontSize: 10 },
          /**
           * pdfmake calls this for every node while it lays out pages.
           *   - "keep-table:*" nodes that would split across pages move to a fresh page, unless they
           *     already start near the top (within 15 pt), where moving gains nothing.
           *   - Signature tables also move when the signing row would not fit on the current page.
           *   - "sigfield:*" nodes only record where a signature field must be placed (and return false).
           */
          pageBreakBefore: node => {
            const id = String(node.id ?? '');
            // Move a split table to a fresh page once; oversized comments may still span pages.
            // verticalRatio is the node's position as a fraction (0..1) of the page's inner height,
            // so ratio * innerHeight is its distance from the top margin in points.
            if (
              id.startsWith('keep-table:') &&
              node.pageNumbers.length > 1 &&
              node.startPosition.verticalRatio * node.startPosition.pageInnerHeight > 15
            ) {
              return true;
            }
            if (id.startsWith('keep-table:signature:')) {
              const prefix = id.slice('keep-table:signature:'.length);
              const positions = node.table.body[1].flatMap(cell => cell.positions || []);
              const first = positions[0];
              // Top and bottom of the current page's content area:
              //   pageTop    = node top - (distance from the top margin)
              //   pageBottom = pageTop + inner page height
              const pageTop = node.startPosition.top - node.startPosition.verticalRatio * node.startPosition.pageInnerHeight;
              const pageBottom = pageTop + node.startPosition.pageInnerHeight;
              // Break if the full signing row (cell height + padding + 1 pt border) would cross the
              // page bottom, or if any cell's first line (16 pt) is already too low.
              if (
                first &&
                (first.top + this.#signatureCellHeight(prefix) + SIG_CELL_PADDING + 1 > pageBottom ||
                  positions.some(position => position.top + 16 > pageBottom))
              )
                return true;
            }
            if (id.startsWith('sigfield:') && node.startPosition) {
              const name = id.slice('sigfield:'.length);
              const prefix = name.slice(0, -'_digital_signature'.length);
              const { pageNumber, pageInnerWidth, left, top } = node.startPosition;
              // The node starts inside the cell padding; the widget should start at the cell border.
              // Field geometry (points):
              //   left   = node left - horizontal padding      (back out to the cell border)
              //   top    = node top  - vertical padding
              //   width  = innerWidth - fixed column 1 - fixed column 2 - 4 * horizontal padding - 2
              //            The '*' column gets what remains. The two fixed columns each add a left and
              //            right padding (2 * 2 = 4 paddings), and 2 pt is allowed for the four 0.5 pt
              //            vertical border lines.
              //   height = cell height + 2 * vertical padding   (the full cell)
              this.#sigFields.push({
                name,
                tooltip: this.#sigTooltips[name] ?? 'Digital signature',
                page: pageNumber,
                left: left - SIG_CELL_HORIZONTAL_PADDING,
                top: top - SIG_CELL_PADDING,
                width:
                  pageInnerWidth -
                  SIG_TABLE_FIXED_COLUMN_WIDTHS[0] -
                  SIG_TABLE_FIXED_COLUMN_WIDTHS[1] -
                  SIG_CELL_HORIZONTAL_PADDING * 4 -
                  2,
                height: this.#signatureCellHeight(prefix) + SIG_CELL_PADDING * 2,
              });
            }
            return false;
          },
        };
      }

      /**
       * Creates the empty placeholder node that marks where a PDF signature field goes.
       * @param {string} prefix Section prefix.
       * @param {string} label Name shown in the field's tooltip.
       * @returns {{text: string, fontSize: number, id: string, margin: number[]}} pdfmake node.
       */
      #signatureField (prefix, label) {
        const name = `${prefix}_digital_signature`;
        this.#sigTooltips[name] = `Digital signature: ${label}`;
        return { text: ' ', fontSize: 10, id: `sigfield:${name}`, margin: [0, 0, 0, 0] };
      }

      /**
       * Height of a signature cell in points.
       * The Independent Review cell is taller because it holds a signature and a professional seal:
       *   height = 2 * SIG_CELL_HEIGHT + 2 * SIG_CELL_PADDING   (for "ir")
       *   height = SIG_CELL_HEIGHT                               (all others)
       * @param {string} prefix Section prefix.
       * @returns {number} Height in points.
       */
      #signatureCellHeight (prefix) {
        return prefix === 'ir' ? SIG_CELL_HEIGHT * 2 + SIG_CELL_PADDING * 2 : SIG_CELL_HEIGHT;
      }

      // ---------- PDF helpers ----------

      /**
       * Builds a name / date / signature table. Without an image, the signature cell holds an
       * empty field that becomes a clickable signature box.
       * @param {string} name Typed name.
       * @param {string} date Date text.
       * @param {string} signatureUrl Signature image data URL, or ''.
       * @param {string} title Role title shown on the name column.
       * @param {string} prefix Section prefix.
       * @returns {Object} pdfmake table node.
       */
      #buildSignatureBlock (name, date, signatureUrl, title, prefix) {
        return this.#signatureTable(
          [
            { text: `${title} Name`, style: 'label' },
            { text: 'Date', style: 'label' },
            { text: prefix === 'ir' ? 'Signature and Seal' : 'Signature', style: 'label' },
          ],
          [
            { text: name || 'N/A', style: 'value' },
            { text: date || 'N/A', style: 'value' },
            signatureUrl
              ? { image: signatureUrl, width: 120, height: this.#signatureCellHeight(prefix) }
              : this.#signatureField(prefix, title),
          ],
          prefix
        );
      }

      /**
       * Table with a full-width empty cell that hosts the clickable PDF signature field.
       * @param {Object[]} headerCells Three header cells.
       * @param {Object[]} valueCells Three value cells.
       * @param {string} prefix Section prefix (sets the row height and the keep-together id).
       * @returns {Object} pdfmake table node.
       */
      #signatureTable (headerCells, valueCells, prefix) {
        return {
          id: `keep-table:signature:${prefix}`,
          table: {
            widths: [...SIG_TABLE_FIXED_COLUMN_WIDTHS, '*'],
            // The signing row has a fixed height so the field can match the cell exactly
            heights: row => (row === 1 ? this.#signatureCellHeight(prefix) : undefined),
            body: [headerCells.map(cell => ({ ...cell, fillColor: '#EDEDED' })), valueCells],
          },
          layout: this.#borderedTableLayout(),
          margin: [0, 5, 0, 5],
        };
      }

      /**
       * Table layout with thin grey borders and the shared cell padding.
       * @returns {Object} pdfmake layout object.
       */
      #borderedTableLayout () {
        return {
          hLineColor: () => '#BFBFBF',
          vLineColor: () => '#BFBFBF',
          hLineWidth: () => 0.5,
          vLineWidth: () => 0.5,
          paddingLeft: () => SIG_CELL_HORIZONTAL_PADDING,
          paddingRight: () => SIG_CELL_HORIZONTAL_PADDING,
          paddingTop: () => SIG_CELL_PADDING,
          paddingBottom: () => SIG_CELL_PADDING,
        };
      }

      /**
       * Builds the two-column comments / response table.
       * @param {Object[]} comments pdfmake content for comments.
       * @param {Object[]} response pdfmake content for the engineer response.
       * @returns {Object} pdfmake node.
       */
      #buildCommentsBlock (comments, response) {
        /** Cell content, or "None" when empty. */
        const cell = content => ({
          stack: content.length ? content : [{ text: 'None', style: 'value' }],
        });
        return {
          stack: [
            {
              id: 'keep-table:comments',
              table: {
                widths: ['*', '*'],
                headerRows: 1,
                body: [
                  [
                    { text: 'Comments & Corrections', style: 'label', fillColor: '#EDEDED' },
                    { text: 'Engineer Response', style: 'label', fillColor: '#EDEDED' },
                  ],
                  [cell(comments), cell(response)],
                ],
              },
              layout: this.#borderedTableLayout(),
              margin: [0, 0, 0, 5],
            },
          ],
          margin: [0, 10, 0, 10],
        };
      }

      /**
       * Builds a checklist table (question and response).
       * @param {Array<{question: string, answer: string}>} rows Checklist rows.
       * @returns {Object} pdfmake table node.
       */
      #buildChecklistBlock (rows) {
        return {
          layout: 'lightHorizontalLines',
          table: {
            widths: ['*', 75],
            headerRows: 1,
            body: [
              [
                { text: 'Checklist item', style: 'tableHeader' },
                { text: 'Response', style: 'tableHeader' },
              ],
              ...rows.map(({ question, answer }) => [
                { text: question, style: 'value' },
                { text: answer, style: 'value', alignment: 'left' },
              ]),
            ],
          },
          margin: [0, 5, 0, 10],
        };
      }

      /**
       * Downloads the BC Hydro logo as a data URL (cached). Gives up after 4 s.
       * @returns {Promise<string>} Data URL, or '' when the logo cannot be loaded.
       */
      async #logoDataUrl () {
        if (this.#logoCache) return this.#logoCache;
        try {
          const response = await fetch(BC_HYDRO_LOGO_URL, { signal: AbortSignal.timeout(4000) });
          if (!response.ok) return '';
          const blob = await response.blob();
          this.#logoCache = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result));
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
          return this.#logoCache;
        } catch {
          return '';
        }
      }

      // ---------- PDF section builders ----------

      /**
       * Builds the PDF page header: logo (or a text fallback) and the form title.
       * @param {string} logo Logo data URL, or ''.
       * @returns {Object} pdfmake node.
       */
      #buildFormHeader (logo) {
        return {
          columns: [
            logo ? { width: 100, image: logo } : { width: 'auto', text: 'BC Hydro', bold: true, color: '#046a38', fontSize: 16 },
            {
              width: '*',
              text: 'Distribution Engineering\nCheck & Review Form',
              style: 'header',
              alignment: 'right',
            },
          ],
          margin: [0, 0, 0, 10],
        };
      }

      /**
       * Builds the Work Information table. Rows whose value is null (disabled fields) are left out.
       * @param {Object} info Work info data.
       * @returns {Object} pdfmake node.
       */
      #buildWorkInfoSection (info) {
        return {
          stack: [
            { text: 'Work Information', style: 'sectionTitle' },
            {
              layout: 'lightHorizontalLines',
              table: {
                widths: ['30%', '70%'],
                body: [
                  ['Work Title', info.title || ''],
                  ['Revision', info.revision || ''],
                  ['Your Role', info.role || ''],
                  ['Risk Level', info.riskLevel || ''],
                  ['Deliverable / Milestone', info.deliverable || ''],
                  ['Minimum Check Level', info.minCheckLevel || ''],
                  [info.role === 'Engineer-in-Training' ? 'Engineer-in-Training' : 'Engineer', info.engineer || ''],
                  ['Direct Supervisor', info.directSupervisor],
                  ['Checker', info.checker],
                ]
                  .filter(row => row[1] !== null)
                  .map(row => [
                    { text: row[0], style: 'label' },
                    { text: row[1], style: 'value' },
                  ]),
              },
            },
          ],
        };
      }

      /**
       * Builds Section 1 (Self-Check), with Section 2 nested before the signature when it applies.
       * @param {Object} data Self-check data.
       * @param {Object|null} [directSupervision] Direct supervision data, or null.
       * @returns {Object} pdfmake node.
       */
      #buildSelfCheckSection (data, directSupervision = null) {
        return {
          stack: [
            { text: '1. Self-Check', style: 'sectionTitle' },
            this.#buildChecklistBlock(data.checklist),
            ...(directSupervision ? [this.#buildDirectSupervisionSection(directSupervision)] : []),
            this.#buildSignatureBlock(data.name, data.date, data.signature, 'Professional of Record', 'sc'),
          ],
        };
      }

      /**
       * Builds Section 2 (Direct Supervision).
       * @param {Object} data Direct supervision data.
       * @returns {Object} pdfmake node.
       */
      #buildDirectSupervisionSection (data) {
        return {
          stack: [{ text: '2. Direct Supervision', style: 'sectionTitle' }, this.#buildChecklistBlock(data.checklist)],
        };
      }

      /**
       * Builds Section 3 (Check).
       * @param {Object} data Check data.
       * @returns {Object} pdfmake node.
       */
      #buildCheckSection (data) {
        return {
          stack: [
            { text: '3. Check', style: 'sectionTitle' },
            this.#buildChecklistBlock(data.checklist),
            this.#buildCommentsBlock(data.comments, data.response),
            this.#buildSignatureBlock(data.name, data.date, data.signature, 'Checker', 'ch'),
          ],
        };
      }

      /**
       * Builds Section 4 (Peer Review).
       * @param {Object} data Peer review data.
       * @returns {Object} pdfmake node.
       */
      #buildPeerReviewSection (data) {
        return {
          stack: [
            { text: '4. Peer Review', style: 'sectionTitle' },
            this.#buildChecklistBlock(data.checklist),
            {
              text: 'Note: Applies when POR requests additional peer review. NOT for Type 1 High Risk Work Independent Review.',
              style: 'warning',
            },
            this.#buildCommentsBlock(data.comments, data.response),
            this.#buildSignatureBlock(data.name, data.date, data.signature, 'Peer Reviewer', 'pr'),
          ],
        };
      }

      /**
       * Builds Section 5 (Independent Structural Review).
       * @param {Object} data Independent review data.
       * @returns {Object} pdfmake node.
       */
      #buildIndependentReviewSection (data) {
        return {
          stack: [
            { text: '5. Independent Structural Review', style: 'sectionTitle' },
            this.#buildChecklistBlock(data.checklist),
            this.#buildCommentsBlock(data.comments, data.response),
            this.#buildSignatureBlock(data.name, data.date, data.signature, 'Independent Reviewer', 'ir'),
          ],
        };
      }

      /**
       * Builds Section 6 (assigned Tier 1 Reviewer and Team Lead signature).
       * @param {Object} data Tier 1 reviewer data.
       * @returns {Object} pdfmake node.
       */
      #buildTier1Section (data) {
        return {
          stack: [
            { text: '6. Appoint Tier 1 Reviewer & Team Lead Signatures', style: 'sectionTitle' },
            this.#signatureTable(
              [
                { text: 'Assigned Type 1 Reviewer', style: 'label' },
                { text: 'Date', style: 'label' },
                { text: 'DE Team Lead Signature', style: 'label' },
              ],
              [
                { text: data.assignedReviewer || 'N/A', style: 'value' },
                { text: data.date || 'N/A', style: 'value' },
                data.tlSignature
                  ? { image: data.tlSignature, width: 120, height: 40 }
                  : {
                    text: 'Not signed',
                    style: 'value',
                    italics: true,
                  },
              ],
              'fT1'
            ),
          ],
        };
      }

      // ---------- Save snapshot ----------

      /**
       * Saves the page as a standalone HTML file that reopens with all answers filled in.
       * Live values are copied into the cloned markup as attributes (value, checked, selected),
       * and a JSON block with the same state is appended for tools that read it.
       * @returns {void}
       */
      saveSnapshot () {
        this.#comments.syncAllHidden();
        const clone = document.documentElement.cloneNode(true);
        const formState = {};

        /** Finds the clone's copy of a live control: by id first, then by radio / checkbox name and value. */
        const findCloneControl = live => {
          if (live.id) {
            try {
              const byId = clone.querySelector(`#${CSS.escape(live.id)}`);
              if (byId) return byId;
            } catch {
              console.error('Error finding element by id'); /* fall through to name lookup */
            }
          }
          const type = (live.getAttribute('type') || '').toLowerCase();
          const name = live.getAttribute('name');
          if (name && (type === 'radio' || type === 'checkbox')) {
            try {
              return clone.querySelector(`input[type="${type}"][name="${CSS.escape(name)}"][value="${CSS.escape(live.value)}"]`);
            } catch {
              console.error('Error finding element by name and value'); /* no match */
            }
          }
          return null;
        };

        for (const live of document.querySelectorAll('input, textarea, select')) {
          const el = findCloneControl(live);
          if (!el) continue;
          const key = live.id || live.name;
          if (!key) continue;

          if (el.tagName === 'TEXTAREA') {
            el.textContent = live.value;
            formState[key] = live.value;
            continue;
          }
          if (el.tagName === 'SELECT') {
            Array.from(el.options).forEach(o => o.removeAttribute('selected'));
            if (live.selectedIndex >= 0) el.options[live.selectedIndex]?.setAttribute('selected', '');
            formState[key] = { value: live.value, selectedIndex: live.selectedIndex };
            continue;
          }
          const type = el.getAttribute('type')?.toLowerCase();
          if (type === 'radio' || type === 'checkbox') {
            if (live.checked) el.setAttribute('checked', '');
            else el.removeAttribute('checked');
            formState[key] = live.checked;
            continue;
          }
          el.setAttribute('value', live.value);
          formState[key] = live.value;
        }

        const progressVal = this.elements.progressBar.value;
        clone.querySelector('#progressBar')?.setAttribute('value', progressVal);
        formState.progressBar = progressVal;

        // Metadata block (checked state also lives in the cloned attributes above).
        // "<" is escaped as \u003c so the JSON can never close its own <script> tag.
        const metaScript = document.createElement('script');
        metaScript.type = 'application/json';
        metaScript.dataset.snapshotFormState = '';
        metaScript.textContent = JSON.stringify(formState).replace(/</g, '\\u003c');
        clone.appendChild(metaScript);
        const blob = new Blob([`<!DOCTYPE html>\n${clone.outerHTML}`], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const title = this.elements.workTitle.value.trim() || 'DE_CheckForm';
        const safe = title
          .replace(/[\\/:*?"<>|]+/g, '-')
          .replace(/\s+/g, '_')
          .trim()
          .slice(0, 80);
        const ts = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD, never contains "/"
        const a = document.createElement('a');
        if (window.location.protocol === 'file:') {
          const filename = prompt('Save snapshot as:', `${safe}_snapshot_${ts}.html`);
          if (!filename) {
            URL.revokeObjectURL(url);
            return;
          }
          a.download = filename.endsWith('.html') ? filename : `${filename}.html`;
        } else {
          a.download = `${safe}_snapshot_${ts}.html`;
        }
        a.href = url;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        this.showToast('Snapshot saved', 'success');
      }

      // ---------- Cleanup ----------

      /**
       * Removes all listeners and timers created by this instance.
       * @returns {void}
       */
      destroy () {
        this.#comments.destroy();
        document.removeEventListener('click', this.#boundClick);
        document.removeEventListener('change', this.#boundChange);
        document.removeEventListener('input', this.#boundInput);
        document.removeEventListener('keydown', this.#boundKeydown);
        document.removeEventListener('focusin', this.#boundFocusin);
        document.removeEventListener('pointerdown', this.#boundPointerdown);
        getById('check_form')?.removeEventListener('submit', this.#boundSubmit);
        if (this.#progressTimer) {
          clearTimeout(this.#progressTimer);
          this.#progressTimer = null;
        }
      }
    }

    // ============================================================
    // 9. Reader mode (Edge Immersive Reader / Chrome Reading mode)
    // Reader views strip form controls, so mirror the form as text.
    // ============================================================

    /**
     * Keeps a hidden plain-text copy of the form (#readerSummary) up to date,
     * because reader modes drop form controls but keep text.
     */
    const readerSummary = (() => {
      const clean = s => (s || '').replace(/\s+/g, ' ').trim();
      const labelOf = el => {
        const lbl = el.id && document.querySelector(`label[for="${CSS.escape(el.id)}"]`);
        return clean(lbl?.textContent);
      };
      const valueOf = el => {
        if (el.tagName === 'SELECT') {
          return el.selectedOptions[0]?.disabled || !el.value ? '' : clean(el.selectedOptions[0]?.textContent);
        }
        return clean(el.value);
      };
      const el = (tag, text) => {
        const node = document.createElement(tag);
        node.textContent = text;
        return node;
      };

      function cellText (cell) {
        const title = clean(cell.querySelector('.field-label')?.textContent);
        const checked = [...cell.querySelectorAll('input[type=radio]:checked')].map(r => labelOf(r) || r.value);
        const pressed = [...cell.querySelectorAll('[aria-pressed="true"]')].map(b => clean(b.textContent));
        const fields = [...cell.querySelectorAll('input:not([type=radio]):not([type=hidden]), select, textarea')]
          .map(valueOf)
          .filter(Boolean);
        const value = [...checked, ...pressed, ...fields].join(', ');
        return `${title}: ${value || 'Not provided'}`;
      }

      function rowText (row) {
        const num = clean(row.querySelector('.check-num')?.textContent);
        const text = clean(row.querySelector('.check-text')?.textContent);
        const r = row.querySelector('input[type=radio]:checked');
        const answer = r ? { yes: 'Yes', no: 'No', na: 'N/A' }[r.value] || r.value : 'Not answered';
        const notice = clean(row.querySelector('.row-notice-stack:not(.hidden)')?.textContent);
        return `${num} ${text} — ${answer}${notice ? ` (${notice})` : ''}`;
      }

      function render () {
        const host = getById('readerSummary');
        if (!host) return;
        const frag = document.createDocumentFragment();
        frag.append(el('h1', 'Distribution Engineering Check & Review Form'));
        const pct = getById('progressPct')?.textContent;
        if (pct != null) frag.append(el('p', `Completion: ${pct}%`));

        document.querySelectorAll('#check_form .card:not(.hidden)').forEach(card => {
          const title = clean(card.querySelector('.sec-title')?.textContent);
          const badge = clean(card.querySelector('.sec-badge')?.textContent);
          frag.append(el('h2', badge ? `${title} (${badge})` : title));
          const own = n => n.closest('.card') === card;
          const handled = new Set();
          card.querySelectorAll('.meta-cell, .check-row').forEach(n => {
            if (!own(n)) return;
            n.querySelectorAll('input, select, textarea').forEach(i => handled.add(i));
            frag.append(el('p', n.classList.contains('check-row') ? rowText(n) : cellText(n)));
          });
          card.querySelectorAll('input:not([type=radio]):not([type=hidden]), select, textarea').forEach(f => {
            if (handled.has(f) || !own(f)) return;
            const label = labelOf(f) || f.getAttribute('aria-label') || f.name || f.id;
            if (label) frag.append(el('p', `${clean(label)}: ${valueOf(f) || 'Not provided'}`));
          });
        });
        host.replaceChildren(frag);
      }

      let timer = null;
      const schedule = () => {
        clearTimeout(timer);
        timer = setTimeout(render, 250);
      };

      function init () {
        window.addEventListener('pageshow', render);
        document.addEventListener('visibilitychange', render);
      }
      return { init, render };
    })();

    // ============================================================
    // 10. Boot
    // ============================================================

    /**
     * Starts the app: builds the form markup if the page does not already contain it
     * (a saved snapshot does), creates CheckForm, then starts the reader summary.
     * @returns {void}
     */
    function boot () {
      if (!getById('check_form')) new HtmlBuilder().mount();
      window.__checkFormInstance = new CheckForm();
      // Reader summary runs after CheckForm has built the question rows
      setTimeout(() => readerSummary.init(), 0);
    }

    if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
    else boot();

    // Exposed for debugging / automation
    window.CheckForm = CheckForm;

  </script>
</body>

</html>
