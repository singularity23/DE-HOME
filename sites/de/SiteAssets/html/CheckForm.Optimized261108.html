        return getById(`${prefix}_sig_data`);
      }

      /**
       * Returns the draw surface (preview area) of a section.
       * @param {string} prefix Section prefix.
       * @returns {Element|null}
       */
      getSurface (prefix) {
        return query(`.sig-draw-surface[data-prefix="${prefix}"]`);
      }

      /**
       * Shows or clears the inline signature preview and switches to the matching tab.
       * @param {string} prefix Section prefix.
       * @param {string} dataUrl Image data URL, or '' to clear.
       * @returns {void}
       */
      setPreview (prefix, dataUrl) {
        const surface = this.getSurface(prefix);
        const img = surface?.querySelector('.sig-inline-preview img');
        if (!surface || !img) return;
        if (dataUrl) {
          img.src = dataUrl;
          surface.classList.add('has-signature');
        } else {
          img.removeAttribute('src');
          surface.classList.remove('has-signature');
        }
        const container = surface.closest('.signature-pad-container');
        const tabBtn = container?.querySelector(`.btn-sig-tab[data-tab="${dataUrl ? 'draw' : 'upload'}"]`);
        if (tabBtn) this.setTab(tabBtn);
      }

      /**
       * Removes a section's signature data and preview.
       * @param {string} prefix Section prefix.
       * @returns {void}
       */
      clearInline (prefix) {
        const dataInput = this.#dataInput(prefix);
        if (dataInput) dataInput.value = '';
        this.setPreview(prefix, '');
      }

      /**
       * Re-renders every preview from the hidden inputs (after a snapshot loads).
       * @returns {void}
       */
      refreshPreviews () {
        CONFIG.SIG_PREFIXES.forEach(prefix => {
          this.setPreview(prefix, this.#dataInput(prefix)?.value || '');
        });
      }

      // ---------- Gating (ch / pr / ir signatures unlock when the
      // "comments addressed" question is Yes or N/A) ----------

      /**
       * Tells whether a section's signature may be used.
       * Check, Peer Review, and Independent Review unlock when "comments addressed" is Yes or N/A.
       * @param {string} prefix Section prefix.
       * @returns {boolean}
       */
      isEnabledByComments (prefix) {
        if (prefix !== 'ch' && prefix !== 'pr' && prefix !== 'ir') return true;
        const yes = this.#host.elements[`${prefix}CYes`];
        const na = this.#host.elements[`${prefix}CNa`];
        return !!(yes?.checked || na?.checked);
      }

      /**
       * Locks or unlocks every control in a section's signature widget.
       * Locking also empties file inputs.
       * @param {string} prefix Section prefix.
       * @param {boolean} enabled True to unlock.
       * @returns {void}
       */
      setEnabled (prefix, enabled) {
        const container = getById(`${prefix}SigContainer`);
        if (!container) return;
        container.classList.toggle('is-locked', !enabled);
        container.setAttribute('aria-disabled', enabled ? 'false' : 'true');
        container.querySelectorAll('button, input[type="file"]').forEach(el => {
          el.disabled = !enabled;
          if (el instanceof HTMLInputElement && !enabled) el.value = '';
        });
      }

      /**
       * Applies the comments-addressed rule to one section's signature widget.
       * @param {string} prefix Section prefix.
       * @returns {void}
       */
      updateGating (prefix) {
        this.setEnabled(prefix, this.isEnabledByComments(prefix));
      }

      /**
       * Checks that every open Check / Peer / Independent section has its signature unlocked.
       * @returns {boolean} False when an open section is still locked.
       */
      allOpenEnabled () {
        for (const prefix of ['ch', 'pr', 'ir']) {
          const body = getById(`card-${prefix}`)?.querySelector('.sec-body');
          if (body?.classList.contains('open') === true && !this.isEnabledByComments(prefix)) return false;
        }
        return true;
      }

      // ---------- Signature Tooltip ----------
      #showTooltip () {
        const
          SHOW_DELAY = 150,
          HIDE_DELAY = 100;

        for (const trigger of document.querySelectorAll('.tooltip-trigger')) {
          const tooltip = document.getElementById(trigger.getAttribute('aria-describedby'));

          let showTimer, hideTimer;

          const show = () => {
            clearTimeout(hideTimer);
            showTimer = setTimeout(() => { tooltip?.showPopover(); }, SHOW_DELAY);
          }

          const hide = () => {
            clearTimeout(showTimer);
            // A delay before hiding lets the pointer travel onto the tooltip
            // itself without it disappearing (WCAG 1.4.13: content must be hoverable)
            hideTimer = setTimeout(() => {
              if (tooltip?.matches(':popover-open')) {
                tooltip?.hidePopover();
              }
              // if (tooltipArrow?.matches(':popover-open')) {
              //   tooltipArrow?.hidePopover();
              // }
            }, HIDE_DELAY);
          }

          trigger.addEventListener('mouseenter', show);
          trigger.addEventListener('mouseleave', hide);
          trigger.addEventListener('focus', show);
          trigger.addEventListener('blur', hide);

          // Keep the tooltip open while the pointer is over it
          tooltip?.addEventListener('mouseenter', () => clearTimeout(hideTimer));
          tooltip?.addEventListener('mouseleave', hide);

        }
      }

      // ---------- Modal ----------

      /**
       * @returns {boolean} True while the drawing modal is open.
       */
      isOpen () {
        return !!this.#modal?.classList.contains('open');
      }

      /**
       * Opens the drawing modal for a section, loading any saved signature onto the canvas.
       * @param {string} prefix Section prefix.
       * @returns {void}
       */
      open (prefix) {
        if (!this.#modal || !this.#canvas) return;
        this.#activePrefix = prefix;
        this.#returnFocus = document.activeElement;
        if (this.#title) this.#title.textContent = 'Draw signature';
        this.#modal.classList.add('open');
        this.#modal.dataset.prefix = prefix;
        this.#resizeCanvas();
        this.#loadDataUrl(this.#dataInput(prefix)?.value || '');
        this.#lastTsReset?.();
        this.#installFocusTrap();
        this.#modal.querySelector('[data-action="close-sig-modal"]')?.focus?.();
      }

      /**
       * Closes the drawing modal, optionally saving the canvas, and restores focus.
       * @param {boolean} save True to store the drawing as the section's signature.
       * @returns {void}
       */
      close (save) {
        if (!this.#modal || !this.#canvas) return;
        const prefix = this.#activePrefix;
        if (save && prefix) {
          const dataUrl = this.#canvas.toDataURL();
          const dataInput = this.#dataInput(prefix);
          if (dataInput) dataInput.value = dataUrl;
          this.setPreview(prefix, dataUrl);
        }
        this.#modal.classList.remove('open');
        this.#activePrefix = null;
        this.#stopRaf?.();
        this.#resetStroke?.();
        this.#uninstallFocusTrap();
        const back = this.#returnFocus;
        this.#returnFocus = null;
        if (back?.isConnected) back.focus?.();
      }

      /**
       * Erases the canvas.
       * @returns {void}
       */
      clearCanvas () {
        if (!this.#canvas) return;
        const { width, height } = this.#getCssSize(this.#canvas);
        // The 2D transform already scales by devicePixelRatio, so clearing in CSS pixels covers the bitmap.
        this.#canvas.getContext('2d').clearRect(0, 0, width, height);
      }

      // ---------- Modal focus trap ----------

      /**
       * Keeps Tab and Shift+Tab inside the modal while it is open.
       * @returns {void}
       */
      #installFocusTrap () {
        this.#uninstallFocusTrap();
        const modal = this.#modal;
        const FOCUSABLE = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
        this.#focusHandler = e => {
          if (e.key !== 'Tab') return;
          const focusables = Array.from(modal.querySelectorAll(FOCUSABLE)).filter(el => !el.disabled);
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          // Wrap focus at either end of the tab order.
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        };
        document.addEventListener('keydown', this.#focusHandler);
        clearTimeout(this.#trapTimer);
        this.#trapTimer = setTimeout(() => {
          modal.querySelector(FOCUSABLE)?.focus();
        }, 50);
      }

      /**
       * Removes the focus trap listener and its pending timer.
       * @returns {void}
       */
      #uninstallFocusTrap () {
        if (this.#focusHandler) {
          document.removeEventListener('keydown', this.#focusHandler);
          this.#focusHandler = null;
        }
        clearTimeout(this.#trapTimer);
      }

      // ---------- Canvas ----------

      /**
       * Returns an element's layout size in CSS pixels.
       * @param {HTMLElement} canvas Element to measure.
       * @returns {{width: number, height: number}}
       */
      #getCssSize (canvas) {
        const rect = canvas.getBoundingClientRect();
        return {
          width: canvas.offsetWidth || rect.width,
          height: canvas.offsetHeight || rect.height,
        };
      }

      /**
       * Sizes the canvas bitmap for the current display density.
       * @returns {void}
       */
      #resizeCanvas () {
        const canvas = this.#canvas;
        if (!canvas) return;
        const { width: cssW, height: cssH } = this.#getCssSize(canvas);
        if (!cssW || !cssH) return;
        // HiDPI scaling: the bitmap gets cssSize * devicePixelRatio pixels so strokes stay sharp,
        // and setTransform(dpr, ...) makes drawing code keep working in CSS pixels.
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 2;
      }

      /**
       * Draws a saved signature onto the (cleared) canvas, stretched to the canvas size.
       * @param {string} dataUrl Image data URL, or '' for a blank canvas.
       * @returns {void}
       */
      #loadDataUrl (dataUrl) {
        this.clearCanvas();
        if (!dataUrl) return;
        const canvas = this.#canvas;
        const ctx = canvas.getContext('2d');
        const { width: cssW, height: cssH } = this.#getCssSize(canvas);
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, cssW, cssH);
        img.src = dataUrl;
      }

      /**
       * Sets up the pen: pointer events plus an animation-frame loop.
       *
       * Pen model, evaluated once per frame:
       *   1. "Lazy" brush: the brush follows the pointer on a leash of `lazyRadius` px.
       *      While the pointer is inside the leash the brush stays put, which hides hand jitter.
       *   2. Position smoothing: the brush moves toward its target by an exponential factor
       *      (see expSmoothingFactor), so motion is frame-rate independent.
       *   3. Width from speed: fast strokes get thinner, slow strokes thicker (like a pen).
       *   4. Stroke is drawn as quadratic curves through midpoints, which removes corners.
       * @returns {void}
       */
      #setupCanvasDrawing () {
        const canvas = this.#canvas;
        const ctx = canvas.getContext('2d');
        const TARGET_DT_MS = 1000 / 60; // fallback frame time (60 fps)
        const lazyRadius = 6; // px the pointer can move before the brush follows
        const friction = 0.02; // 0..1; damps the brush slightly so it trails the pointer
        const posSmoothingHz = 26; // higher = brush catches up faster
        const widthSmoothingHz = 20; // higher = width reacts to speed faster
        const minWidth = 5.0; // px, at or above speedForMinWidth
        const maxWidth = 12.0; // px, when nearly still
        const speedForMinWidth = 1100; // px/s at which the line reaches minWidth

        let drawing = false;
        let hasPointer = false;
        let pointer = { x: canvas.width * 0.5, y: canvas.height * 0.5 };
        let brush = { ...pointer };
        let prevBrush = { ...brush };
        let currentWidth = maxWidth;
        let lastTs = performance.now();
        let prevMid = null;

        /**
         * Exponential smoothing factor: the share of the remaining gap to close this frame.
         *   alpha = 1 - e^(-hz * dt)
         * Because it uses elapsed time `dt`, the motion feels the same at 30, 60, or 144 fps.
         * Small hz*dt gives alpha ~ hz*dt (slow); large hz*dt gives alpha -> 1 (snap).
         * @param {number} hz Smoothing rate in 1/s.
         * @param {number} dtSec Frame time in seconds.
         * @returns {number} Value between 0 and 1.
         */
        const expSmoothingFactor = (hz, dtSec) => 1 - Math.exp(-hz * dtSec);

        /** Converts a pointer event to canvas-relative CSS pixel coordinates. */
        const getCanvasPoint = e => {
          const rect = canvas.getBoundingClientRect();
          return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        };

        /** Ends the current stroke. */
        const endDraw = () => {
          drawing = false;
          hasPointer = false;
          prevMid = null;
        };

        canvas.addEventListener('pointerdown', e => {
          canvas.setPointerCapture(e.pointerId);
          hasPointer = true;
          drawing = true;
          pointer = getCanvasPoint(e);
          brush = { ...pointer };
          prevBrush = { ...pointer };
          currentWidth = maxWidth;
          prevMid = null;
          this.#scheduleFrame();
        });
        canvas.addEventListener('pointermove', e => {
          if (hasPointer) pointer = getCanvasPoint(e);
        });
        canvas.addEventListener('pointerup', endDraw);
        canvas.addEventListener('pointercancel', endDraw);
        canvas.addEventListener('dblclick', () => this.clearCanvas());

        /**
         * One animation frame: moves the brush, updates the width, draws one curve segment.
         * @param {number} ts High-resolution timestamp from requestAnimationFrame.
         */
        this.#frame = ts => {
          this.#rafId = 0;
          if (!canvas.isConnected || !this.#modal?.classList.contains('open')) {
            if (hasPointer) endDraw();
            return;
          }
          // Frame time in ms, limited to 1..33 so a stalled tab does not cause a huge jump.
          const dtMsRaw = ts - lastTs || TARGET_DT_MS;
          const dtMs = Math.min(33, Math.max(1, dtMsRaw));
          const dtSec = dtMs / 1000;
          lastTs = ts;

          if (hasPointer) {
            // Lazy brush: distance from brush to pointer.
            const dx = pointer.x - brush.x;
            const dy = pointer.y - brush.y;
            const dist = Math.hypot(dx, dy);
            if (dist > lazyRadius) {
              // Only the part of the distance beyond the leash counts. (tx, ty) is the point on the
              // brush->pointer line that is exactly `lazyRadius` short of the pointer.
              const pull = dist - lazyRadius;
              const tx = brush.x + (dx / dist) * pull;
              const ty = brush.y + (dy / dist) * pull;
              const posAlpha = expSmoothingFactor(posSmoothingHz, dtSec) * (1 - friction);
              brush.x += (tx - brush.x) * posAlpha;
              brush.y += (ty - brush.y) * posAlpha;
            }
            // Speed in px/s = distance moved this frame / frame time.
            const vx = brush.x - prevBrush.x;
            const vy = brush.y - prevBrush.y;
            const speed = Math.hypot(vx, vy) / dtSec;
            // Width from speed: linear blend from maxWidth (t = 0, still) to minWidth (t = 1, fast).
            //   width = maxWidth - (maxWidth - minWidth) * clamp(speed / speedForMinWidth, 0, 1)
            const t = clamp(speed / speedForMinWidth, 0, 1);
            const targetWidth = maxWidth - (maxWidth - minWidth) * t;
            currentWidth += (targetWidth - currentWidth) * expSmoothingFactor(widthSmoothingHz, dtSec);

            if (drawing) {
              // Midpoint smoothing: draw a quadratic curve from the previous midpoint to the new
              // midpoint, using the previous brush position as the control point. Consecutive
              // segments then share tangents, so the line has no visible corners.
              const midX = (prevBrush.x + brush.x) * 0.5;
              const midY = (prevBrush.y + brush.y) * 0.5;
              ctx.strokeStyle = '#111';
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.lineWidth = currentWidth;
              ctx.beginPath();
              if (prevMid) ctx.moveTo(prevMid.x, prevMid.y);
              else ctx.moveTo(prevBrush.x, prevBrush.y);
              ctx.quadraticCurveTo(prevBrush.x, prevBrush.y, midX, midY);
              ctx.stroke();
              prevMid = { x: midX, y: midY };
            }
            prevBrush.x = brush.x;
            prevBrush.y = brush.y;
            this.#scheduleFrame();
          }
        };

        /** Requests the next animation frame unless one is already pending. */
        this.#scheduleFrame = () => {
          if (!this.#rafId) this.#rafId = requestAnimationFrame(this.#frame);
        };
        /** Cancels a pending animation frame. */
        this.#stopRaf = () => {
          if (this.#rafId) {
            cancelAnimationFrame(this.#rafId);
            this.#rafId = 0;
          }
        };
        this.#resetStroke = endDraw;
        /** Resets the frame clock so the first frame after opening has a normal dt. */
        this.#lastTsReset = () => {
          lastTs = performance.now();
        };
      }
    }

    // ============================================================
    // 7. CommentEditorManager — lazy Quill, fallback editors,
    // inline images, height pairing
    // ============================================================

    /**
     * Manages the six comment boxes. Loads Quill on first use and falls back to a simple
     * contenteditable editor when Quill cannot load. Keeps hidden inputs in sync, handles
     * pasted screenshots in the fallback, and equalizes the height of paired editors.
     */
    class CommentEditorManager {
      #host;
      #initialized = false;
      #quillEditors = null;
      #fallbackEditors = null;
      #syncRaf = 0;

      /**
       * @param {CheckForm} host Owning form (used for toasts and state flags).
       */
      constructor(host) {
        this.#host = host;
      }

      // ---------- Lazy init ----------

      /**
       * Starts editor setup the first time it is needed; later calls only move focus.
       * @param {Element} [focusTarget] Element near the editor to focus once ready.
       * @returns {void}
       */
      ensureInitialized (focusTarget) {
        if (this.#initialized) {
          if (focusTarget) this.#focusEditorNear(focusTarget);
          return;
        }
        this.#initialized = true;
        this.#init(focusTarget);
      }

      /**
       * Loads dependencies and builds editors; uses fallback editors on failure.
       * @param {Element} [focusTarget] Element near the editor to focus afterward.
       * @returns {Promise<void>}
       */
      async #init (focusTarget) {
        try {
          await this.#loadDependencies();
          this.#initQuillEditors();
        } catch (err) {
          console.warn('Quill unavailable, using fallback:', err);
          this.#host.showToast('Rich‑text editor failed to load, simple text mode active', 'warn');
          this.#initFallbackEditors();
        }
        if (!this.#host.isRestored) this.restore();
        this.syncHeights();
        if (focusTarget) this.#focusEditorNear(focusTarget);
      }

      /**
       * Focuses the editor in the same wrapper as `target`.
       * @param {Element} target Element inside a .rich-text-wrapper.
       * @returns {void}
       */
      #focusEditorNear (target) {
        if (!target?.isConnected) return;
        const wrapper = target.closest('.rich-text-wrapper');
        if (!wrapper) return;
        const fieldId = wrapper.querySelector('input[type="hidden"]')?.id;
        const editorEl = fieldId ? getById(`${fieldId}-editor`) : null;
        editorEl?.focus?.();
        editorEl?.querySelector?.('.ql-editor')?.focus?.();
      }

      /**
       * Loads DOMPurify (optional), Quill, and Quill's CSS in parallel.
       * A DOMPurify failure is tolerated (the allowlist sanitizer takes over).
       * @returns {Promise<Array>}
       */
      #loadDependencies () {
        const purifier =
          typeof DOMPurify === 'undefined'
            ? loadCdnAsset('DOMPURIFY_JS', 'script', 10000, () => typeof window.DOMPurify?.sanitize === 'function').catch(err => {
              console.warn('DOMPurify failed to load, using fallback sanitizer:', err);
            })
            : Promise.resolve();
        const quill =
          typeof Quill === 'undefined'
            ? loadCdnAsset('QUILL_JS', 'script', 10000, () => typeof Quill === 'function')
            : Promise.resolve();
        const css = loadCdnAsset('QUILL_CSS', 'stylesheet');
        return Promise.all([purifier, quill, css]);
      }

      // ---------- Adapter ----------

      /**
       * Returns one interface for a comment field, whichever editor type backs it.
       * @param {string} fieldId Hidden field id (for example "checkerComments").
       * @returns {{container: (Element|null), getHtml: () => string, setHtml: (html: string) => void}}
       */
      #adapter (fieldId) {
        const quill = this.#quillEditors?.[fieldId];
        if (quill) {
          return {
            container: getById(`${fieldId}-editor`),
            getHtml: () => quill.root?.innerHTML ?? '',
            setHtml: html => this.#setQuillHtml(quill, html),
          };
        }
        const fallback = this.#fallbackEditors?.[fieldId] ?? null;
        return {
          container: fallback,
          getHtml: () => fallback?.innerHTML ?? '',
          setHtml: html => {
            if (!fallback) return;
            fallback.innerHTML = sanitizeHtml(html);
            this.updatePlaceholder(fallback);
          },
        };
      }

      /**
       * Loads HTML into Quill through its clipboard so the Delta model stays in sync with the DOM.
       * @param {Object} quill Quill instance.
       * @param {string} html HTML to load (sanitized first).
       * @returns {void}
       */
      #setQuillHtml (quill, html) {
        quill.setContents(quill.clipboard.convert(sanitizeHtml(html)), 'silent');
      }

      /**
       * Replaces a comment box's content.
       * @param {string} fieldId Hidden field id.
       * @param {string} html New HTML (sanitized before use).
       * @returns {void}
       */
      setHtml (fieldId, html) {
        const ad = this.#adapter(fieldId);
        ad.setHtml(html);
        if (ad.container) this.scheduleSyncHeights();
      }

      /**
       * Copies an editor's HTML into its hidden input (the value saved in snapshots).
       * @param {string} fieldId Hidden field id.
       * @returns {void}
       */
      syncHidden (fieldId) {
        const hidden = getById(fieldId);
        const adapter = this.#adapter(fieldId);
        if (!hidden || !adapter.container) return;
        hidden.value = adapter.getHtml();
      }

      /**
       * Runs syncHidden for all six comment boxes.
       * @returns {void}
       */
      syncAllHidden () {
        CONFIG.COMMENT_FIELDS.forEach(([fieldId]) => this.syncHidden(fieldId));
      }

      // ---------- Placeholder / emptiness ----------

      /**
       * Converts HTML to trimmed plain text (non-breaking spaces become spaces).
       * @param {string} html HTML string.
       * @returns {string}
       */
      htmlToPlainText (html) {
        if (!html || html === CONFIG.EMPTY_EDITOR_HTML) return '';
        const el = document.createElement('div');
        el.innerHTML = html;
        return el.textContent?.replace(/\u00a0/g, ' ').trim() ?? '';
      }

      /**
       * Tells whether an editor (or HTML string) has no text and no image.
       * @param {Element|string|null} editorOrHtml Editor element or HTML.
       * @returns {boolean}
       */
      isEditorEmpty (editorOrHtml) {
        if (typeof editorOrHtml === 'string') {
          return !this.htmlToPlainText(editorOrHtml) && !/<img\b /i.test(editorOrHtml);
        }
        if (!editorOrHtml) return true;
        const html = editorOrHtml.innerHTML ?? '';
        if (/<img\b/i.test(html)) return false;
        return !this.htmlToPlainText(html);
      }

      /**
       * Toggles the "is-empty" class that shows the placeholder on a fallback editor.
       * @param {Element|null} editor Fallback editor element.
       * @returns {void}
       */
      updatePlaceholder (editor) {
        if (!editor?.classList?.contains('comments-inline-editor')) return;
        editor.classList.toggle('is-empty', this.isEditorEmpty(editor));
      }

      /**
       * Replaces each editor container with a Quill instance, keeping any existing content.
       * @returns {void}
       */
      #initQuillEditors () {
        const quillConfig = {
          theme: 'snow',
          modules: {
            toolbar: [['bold', 'italic', 'underline'], [{ list: 'ordered' }], ['link'], ['clean']],
          },
        };
        this.#quillEditors = {};
        this.#fallbackEditors = null;
        CONFIG.COMMENT_FIELDS.forEach(([fieldId, placeholder]) => {
          const container = getById(`${fieldId}-editor`);
          if (!container) return;
          container
            .closest('.rich-text-wrapper')
            ?.querySelectorAll('.ql-toolbar')
            .forEach(t => t.remove());
          const existingHtml = container.querySelector('.ql-editor')?.innerHTML ?? '';
          container.classList.remove('ql-snow');
          container.innerHTML = '<div class="ql-editor"></div>';
          const quill = new Quill(container, { ...quillConfig, placeholder });
          this.#quillEditors[fieldId] = quill;
          if (existingHtml && existingHtml !== CONFIG.EMPTY_EDITOR_HTML) {
            this.#setQuillHtml(quill, existingHtml);
          }
          this.#bindQuillEditor(quill, fieldId);
        });
        this.scheduleSyncHeights();
      }

      /**
       * Connects a Quill editor to its hidden input and to height syncing.
       * @param {Object} quill Quill instance.
       * @param {string} fieldId Hidden field id.
       * @returns {void}
       */
      #bindQuillEditor (quill, fieldId) {
        // text-change is the single driver: sync the hidden field, then one scheduled height pass.
        quill.on('text-change', () => {
          this.syncHidden(fieldId);
          this.scheduleSyncHeights();
        });
        quill.root.tabIndex = 0;
        // Pasted images change height when they finish loading (load doesn't bubble, so capture).
        quill.root.addEventListener('load', () => this.scheduleSyncHeights(), true);
      }

      // ---------- Fallback editors (Quill failed / unavailable) ----------

      /**
       * Builds simple contenteditable editors in place of Quill.
       * @returns {void}
       */
      #initFallbackEditors () {
        this.#quillEditors = null;
        this.#fallbackEditors = {};
        CONFIG.COMMENT_FIELDS.forEach(([fieldId, placeholder]) => {
          const container = getById(`${fieldId}-editor`);
          const wrapper = container?.closest('.rich-text-wrapper');
          const hidden = getById(fieldId);
          const gallery = getById(`${fieldId}-gallery`);
          if (!container || !wrapper || !hidden) return;
          wrapper.classList.add('comments-editor-fallback');
          container.removeAttribute('id');
          container.hidden = true;
          const initial = hidden.value || container.querySelector('.ql-editor')?.innerHTML || '';
          wrapper.querySelector('textarea.comments-textarea')?.remove();
          let editor = wrapper.querySelector('.comments-inline-editor');
          if (!editor) {
            editor = document.createElement('div');
            editor.className = 'field-input comments-textarea comments-inline-editor';
            wrapper.insertBefore(editor, hidden);
          }
          editor.contentEditable = 'true';
          editor.id = `${fieldId}-editor`;
          editor.innerHTML = sanitizeHtml(this.#buildInitialHtml(initial, gallery));
          this.#bindFallbackEditor(editor, fieldId, placeholder);
          this.#fallbackEditors[fieldId] = editor;
          this.syncHidden(fieldId);
          this.updatePlaceholder(editor);
          const commentsArea = wrapper.closest('.comments-area');
          if (commentsArea && !commentsArea.querySelector('.comments-paste-hint')) {
            const hint = document.createElement('p');
            hint.className = 'comments-paste-hint';
            hint.textContent = 'Tip: Ctrl+V to paste screenshots inside the comment box.';
            commentsArea.appendChild(hint);
          }
        });
        this.scheduleSyncHeights();
      }

      /**
       * Builds the starting HTML of a fallback editor from saved text and gallery thumbnails.
       * Plain text is wrapped in a paragraph with line breaks; gallery images are appended
       * when the saved HTML has none.
       * @param {string} initial Saved content (HTML or plain text).
       * @param {Element|null} gallery Image gallery element.
       * @returns {string} HTML.
       */
      #buildInitialHtml (initial, gallery) {
        let html = (initial || '').trim();
        const galleryUrls = gallery
          ? Array.from(gallery.querySelectorAll('.image-thumbnail img[src]'))
            .map(img => img.src)
            .filter(Boolean)
          : [];
        if (!html.includes('<img') && galleryUrls.length) {
          const imgs = galleryUrls
            .map(src => `<p><img src="${escapeHtml(src)}" alt="Comment attachment" class="comments-inline-image"></p>`)
            .join('');
          html = html ? `${html}${imgs}` : imgs;
        }
        if (html && !/<[a-z][\s\S]*>/i.test(html)) {
          return `<p>${escapeHtml(html).replace(/\n/g, '<br>')}</p>`;
        }
        return html || CONFIG.EMPTY_EDITOR_HTML;
      }

      /**
       * Attaches input, blur, paste, and click handlers to a fallback editor (once).
       * @param {HTMLElement} editor Fallback editor element.
       * @param {string} fieldId Hidden field id.
       * @param {string} placeholder Placeholder text.
       * @returns {void}
       */
      #bindFallbackEditor (editor, fieldId, placeholder) {
        if (editor.dataset.editorBound === '1') return;
        editor.dataset.placeholder = placeholder;
        editor.setAttribute('role', 'textbox');
        editor.setAttribute('aria-multiline', 'true');
        editor.addEventListener('input', () => {
          this.syncHidden(fieldId);
          this.updatePlaceholder(editor);
          this.scheduleSyncHeights();
        });
        editor.addEventListener('blur', () => this.updatePlaceholder(editor));
        editor.addEventListener('load', () => this.scheduleSyncHeights(), true);
        editor.addEventListener('paste', e => {
          const items = e.clipboardData?.items;
          if (!items) return;
          for (const item of items) {
            if (item.type?.startsWith('image/')) {
              const file = item.getAsFile();
              if (file) {
                e.preventDefault();
                this.#processImageFile(file, fieldId);
              }
            }
          }
        });
        editor.addEventListener('click', e => {
          if (e.target instanceof HTMLImageElement && editor.contains(e.target)) {
            e.preventDefault();
            this.showImageModal(e.target.src);
          }
        });
        editor.dataset.editorBound = '1';
      }

      /**
       * Reads a pasted image file and inserts it into a fallback editor.
       * @param {File} file Pasted image.
       * @param {string} fieldId Hidden field id.
       * @returns {void}
       */
      #processImageFile (file, fieldId) {
        if (!file?.type?.startsWith('image/')) return;
        const editor = this.#fallbackEditors?.[fieldId];
        if (!editor) return;
        const reader = new FileReader();
        reader.onload = e => {
          this.#insertImage(editor, e.target.result);
          this.syncHidden(fieldId);
          this.updatePlaceholder(editor);
          this.scheduleSyncHeights();
        };
        reader.onerror = () => this.#host.showToast('Failed to read image.', 'error');
        reader.readAsDataURL(file);
      }

      /**
       * Inserts an image paragraph at the caret (or at the end when the caret is elsewhere).
       * @param {HTMLElement} editor Fallback editor element.
       * @param {string} dataUrl Image data URL.
       * @returns {void}
       */
      #insertImage (editor, dataUrl) {
        if (!editor || !dataUrl) return;
        editor.focus();
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = 'Pasted screenshot';
        img.className = 'comments-inline-image';
        const sel = window.getSelection();
        const block = document.createElement('p');
        block.appendChild(img);
        if (sel?.rangeCount) {
          let range = sel.getRangeAt(0);
          if (!editor.contains(range.commonAncestorContainer)) {
            range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
          }
          range.deleteContents();
          range.insertNode(block);
          range.setStartAfter(block);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          editor.appendChild(block);
        }
        this.updatePlaceholder(editor);
      }

      /**
       * Opens a full-size preview of a comment image. Closes on backdrop click, close button, or Escape.
       * @param {string} dataUrl Image source.
       * @returns {void}
       */
      showImageModal (dataUrl) {
        const modal = document.createElement('div');
        modal.className = 'comment-image-modal';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'comment-image-modal__close';
        closeBtn.setAttribute('aria-label', 'Close preview');
        closeBtn.innerHTML = '<span class="material-symbols-sharp">close</span>';
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = 'Screenshot preview';
        /** Removes the modal and its Escape listener. */
        const close = () => {
          document.removeEventListener('keydown', onEsc);
          modal.remove();
        };
        /** Closes the modal on Escape. */
        const onEsc = e => {
          if (e.key === 'Escape') close();
        };
        modal.addEventListener('click', e => {
          if (e.target === modal) close();
        });
        closeBtn.addEventListener('click', close);
        document.addEventListener('keydown', onEsc);
        modal.append(closeBtn, img);
        document.body.appendChild(modal);
      }

      // ---------- Sizing / height pairing ----------

      /**
       * Resolves the outer container and the inner editing surface for any editor element.
       * @param {Element|null} el A Quill container, Quill editor, or fallback editor.
       * @returns {{container: (Element|null), surface: (Element|null)}}
       */
      #getNodes (el) {
        if (!el) return { container: null, surface: null };
        if (el.classList.contains('comments-inline-editor')) return { container: null, surface: el };
        if (el.classList.contains('ql-editor')) return { container: el.closest('.ql-container'), surface: el };
        if (el.classList.contains('ql-container')) return { container: el, surface: el.querySelector('.ql-editor') };
        const container = el.closest?.('.ql-container');
        if (container) return { container, surface: container.querySelector('.ql-editor') };
        return { container: null, surface: el };
      }

      /**
       * Sets an editor's height, never below the minimum.
       * @param {Element} el Editor element.
       * @param {number} heightPx Height in pixels.
       * @returns {void}
       */
      setHeight (el, heightPx) {
        const { container, surface } = this.#getNodes(el);
        const minH = CONFIG.COMMENT_EDITOR_MIN_HEIGHT;
        const px = `${Math.max(minH, heightPx)}px`;
        if (surface) {
          surface.style.minHeight = '0';
          surface.style.height = px;
        }
        if (container) {
          container.style.minHeight = `${minH}px`;
          container.style.height = px;
        }
      }

      /**
       * Measures how tall an editor's content is.
       * Technique: set height to auto, read scrollHeight (the natural content height), then restore
       * the old height. The result is never below the minimum.
       * @param {Element} el Editor element.
       * @returns {number} Height in pixels.
       */
      measureHeight (el) {
        const { container, surface } = this.#getNodes(el);
        if (!surface) return CONFIG.COMMENT_EDITOR_MIN_HEIGHT;
        const prevSurface = surface.style.height;
        const prevContainer = container?.style.height;
        surface.style.height = 'auto';
        if (container) container.style.height = 'auto';
        const h = Math.max(CONFIG.COMMENT_EDITOR_MIN_HEIGHT, surface.scrollHeight);
        surface.style.height = prevSurface;
        if (container) container.style.height = prevContainer;
        return h;
      }

      /**
       * Resizes one editor to fit its content.
       * @param {Element|null} el Editor element.
       * @returns {void}
       */
      autosize (el) {
        if (el) this.setHeight(el, this.measureHeight(el));
      }

      /**
       * Schedules a height sync when the event target is inside a comment editor.
       * @param {Element} target Event target.
       * @returns {void}
       */
      handleFieldEvent (target) {
        if (resolveCommentEditor(target)) this.scheduleSyncHeights();
      }

      /**
       * Makes paired editors (comment / response) the same height: the larger of the two.
       * If one side is hidden, the visible side just fits its own content.
       * @returns {void}
       */
      syncHeights () {
        CONFIG.COMMENT_PAIRS.forEach(([aId, bId]) => {
          const a = getById(aId);
          const b = getById(bId);
          const aHidden = a?.closest('.comments-cell')?.classList.contains('hidden') ?? true;
          const bHidden = b?.closest('.comments-cell')?.classList.contains('hidden') ?? true;
          if (!a || !b || aHidden || bHidden) {
            if (a && !aHidden) this.autosize(a);
            if (b && !bHidden) this.autosize(b);
            return;
          }
          const h = Math.max(this.measureHeight(a), this.measureHeight(b));
          this.setHeight(a, h);
          this.setHeight(b, h);
        });
      }

      /**
       * Runs syncHeights at most once per animation frame (batches rapid edits).
       * @returns {void}
       */
      scheduleSyncHeights () {
        if (this.#syncRaf) return;
        this.#syncRaf = requestAnimationFrame(() => {
          this.#syncRaf = 0;
          this.syncHeights();
        });
      }

      // ---------- Clear / restore ----------

      /**
       * Empties every editor inside a root element.
       * @param {ParentNode} root Section or document.
       * @returns {void}
       */
      clearContent (root) {
        root.querySelectorAll('.ql-editor, .comments-inline-editor').forEach(el => {
          if (this.#quillEditors) {
            const entry = Object.entries(this.#quillEditors).find(([, q]) => q.root === el);
            if (entry) {
              entry[1].setContents([], 'silent');
              this.syncHidden(entry[0]);
              return;
            }
          }
          el.innerHTML = CONFIG.EMPTY_EDITOR_HTML;
          this.updatePlaceholder(el);
        });
      }

      /**
       * Removes all image thumbnails in the galleries inside a root.
       * @param {ParentNode} root Section or document.
       * @returns {void}
       */
      clearGalleries (root) {
        root.querySelectorAll('.comments-image-gallery').forEach(g => g.replaceChildren());
      }

      /**
       * Loads each hidden input's saved HTML back into its editor.
       * @returns {void}
       */
      restore () {
        CONFIG.COMMENT_FIELDS.forEach(([fieldId]) => {
          const hidden = getById(fieldId);
          if (hidden?.value) this.setHtml(fieldId, hidden.value);
        });
      }

      // ---------- Cleanup ----------

      /**
       * Cancels pending work and detaches Quill listeners.
       * @returns {void}
       */
      destroy () {
        if (this.#syncRaf) cancelAnimationFrame(this.#syncRaf);
        if (this.#quillEditors) {
          Object.values(this.#quillEditors).forEach(q => {
            q.off('text-change');
            q.root.innerHTML = '';
          });
        }
      }
    }

    // ============================================================
    // 8. CheckForm — main orchestrator
    // ============================================================

    /**
     * Main controller. Builds the checklist rows, handles all page events, applies the
     * visibility rules between sections, tracks progress, validates, and exports to PDF or snapshot.
     */
    class CheckForm {
      // Public (read by managers)
      elements;
      sectionConfig;
      isRestored = false;
      /** Radio answers by section and question number, for example formState.sc[8] === 'yes'. */
      formState = { sc: {}, ds: {}, ch: {}, pr: {}, ir: {} };

      // Internals
      #sig;
      #comments;
      #toast;
      #clickActions;
      #boundClick;
      #boundChange;
      #boundInput;
      #boundKeydown;
      #boundFocusin;
      #boundPointerdown;
      #boundSubmit;
      #progressTimer = null;
      #noticeCache = new WeakMap();
      #logoCache = '';
      #sigFields = [];
      #sigTooltips = {};
      #inconsistent = false;

      /**
       * Caches elements, creates the helper managers, and starts the form.
       */
      constructor() {
        this.elements = this.#cacheElements();
        this.sectionConfig = this.#buildSectionConfig();
        this.#sig = new SignatureManager(this);
        this.#comments = new CommentEditorManager(this);
        this.#toast = new Toast(this.elements.globalNotice, this.elements.globalNoticeText);
        this.#clickActions = {
          clearWorkInfoBtn: () => this.clearSection('sec-info-body'),
          clearSec1Btn: () => this.clearSection('s1'),
          clearSec2Btn: () => this.clearSection('s2'),
          clearSec3Btn: () => this.clearSection('s3'),
          clearSec4Btn: () => this.clearSection('s4'),
          clearSec5Btn: () => this.clearSection('s5'),
          clearSec6Btn: () => this.clearSection('s6'),
          resetFormBtn: () => this.resetForm(),
          saveSnapshotBtn: () => this.saveSnapshot(),
          exportPdfBtn: () => this.exportPdf(),
          dismissNoticeBtn: () => this.hideToast(),
        };
        this.#boundClick = e => this.#handleClick(e);
        this.#boundChange = e => this.#handleChange(e);
        this.#boundInput = e => this.#handleInput(e);
        this.#boundKeydown = e => this.#handleKeydown(e);
        this.#boundFocusin = e => {
          if (resolveCommentEditor(e.target)) this.#comments.ensureInitialized();
        };
        this.#boundPointerdown = e => {
          if (e.target.closest?.('.rich-text-wrapper')) this.#comments.ensureInitialized(e.target);
        };
        this.#boundSubmit = e => {
          e.preventDefault();
          this.handleSubmitAttempt();
        };
        this.init();
      }

      /**
       * Rebuilds the radio-answer cache from the DOM (after snapshot load, reset, clear).
       * @returns {void}
       */
      #hydrateFormStateFromDom () {
        const state = { sc: {}, ds: {}, ch: {}, pr: {}, ir: {} };
        for (const radio of queryAll('input[type="radio"]:checked')) {
          const m = ROW_NAME_RE.exec(radio.name);
          if (m) state[m[1]][parseInt(m[2], 10)] = radio.value;
        }
        this.formState = state;
      }

      // ---------- DOM cache ----------

      /**
       * Looks up and stores the elements used repeatedly.
       * @returns {Object<string, *>} Element map.
       */
      #cacheElements () {
        return {
          progressStrip: getById('progressStrip'),
          progressBar: getById('progressBar'),
          progressPct: getById('progressPct'),
          workTitle: getById('workTitle'),
          engineer: getById('engineer'),
          revision: getById('revision'),
          checker: getById('checker'),
          directSuper: getById('direct-supervisor'),
          minCheckLevel: getById('minCheckLevel'),
          riskBtns: document.querySelectorAll('.risk-btn'),
          sc11No: null,
          sc11Yes: null,
          sc9Yes: null,
          scRoleEng: getById('sc_role_eng'),
          chCYes: getById('ch_c_yes'),
          chCNa: getById('ch_c_na'),
          prCYes: getById('pr_c_yes'),
          prCNa: getById('pr_c_na'),
          irCYes: getById('ir_c_yes'),
          irCNa: getById('ir_c_na'),
          cardDs: getById('card-ds'),
          cardCh: getById('card-ch'),
          cardPr: getById('card-pr'),
          cardFinal: getById('card-final'),
          cardIr: getById('card-ir'),
          chNotice: getById('chNotice'),
          globalNotice: getById('globalNotice'),
          globalNoticeText: getById('globalNoticeText'),
          badge1: getById('badge-1'),
          num1: getById('snum-1'),
          badge2: getById('badge-2'),
          num2: getById('snum-2'),
          badge3: getById('badge-3'),
          num3: getById('snum-3'),
          badge4: getById('badge-4'),
          num4: getById('snum-4'),
          badge5: getById('badge-5'),
          num5: getById('snum-5'),
          scRows: getById('sc-rows'),
          dsRows: getById('ds-rows'),
          chRows: getById('ch-rows'),
          prRows: getById('pr-rows'),
          irRows: getById('ir-rows'),
          scName: getById('sc-name'),
          chName: getById('ch-name'),
          engLabel: query('#engineer_eit .field-label'),
          engInput: query('#engineer_eit input'),
          scNameLabel: query('label[for="sc-name"]'),
          scSigLabel: getById('sc_sig'),
          checkerLabel: query('#checker_por .field-label'),
          checkerInput: query('#checker_por input'),
          chNameLabel: query('label[for="ch-name"]'),
          chSigLabel: getById('ch_sig'),
          checkerCommentsLabel: getById('for_checkerComments'),
          engineerResponseLabel: getById('for_engineerResponse'),
          s2Body: getById('s2'),
          s2Head: getById('sec2-head'),
          s3Body: getById('s3'),
          s3Head: getById('sec3-head'),
          s4Body: getById('s4'),
          s4Head: getById('sec4-head'),
          s5Body: getById('s5'),
          s5Head: getById('sec5-head'),
          s6Body: getById('s6'),
          s6Head: getById('sec6-head'),
          exportPdf: getById('exportPdfBtn'),
          validationAnnouncer: getById('validationMessages'),
        };
      }

      /**
       * Describes each checklist section for the progress calculation.
       * @returns {Array<{prefix: string, rowsEl: Element, count: number, badge: Element, num: Element, label: string, cardEl: Element|null}>}
       */
      #buildSectionConfig () {
        const els = this.elements;
        /** Creates one section descriptor. */
        const make = (prefix, rowsEl, items, badge, num, label) => ({
          prefix,
          rowsEl,
          count: items.length,
          badge,
          num,
          label,
          cardEl: getById(`card-${prefix}`),
        });
        return [
          make('sc', els.scRows, CONFIG.SC_ITEMS, els.badge1, els.num1, '1'),
          make('ds', els.dsRows, CONFIG.DS_ITEMS, els.badge2, els.num2, '2'),
          make('ch', els.chRows, CONFIG.CH_ITEMS, els.badge3, els.num3, '3'),
          make('pr', els.prRows, CONFIG.PR_ITEMS, els.badge4, els.num4, '4'),
          make('ir', els.irRows, CONFIG.IR_ITEMS, els.badge5, els.num5, '5'),
        ];
      }

      // ---------- Utilities ----------

      /**
       * @returns {boolean} True when the role is Engineer-in-Training.
       */
      isEitRole () {
        return this.getRadioValue('sc_role') === 'Engineer-in-Training';
      }

      /**
       * Returns the selected value of a radio group.
       * @param {string} name Radio group name.
       * @returns {string|null} Value, or null when none is selected.
       */
      getRadioValue (name) {
        return query(`input[name="${name}"]:checked`)?.value ?? null;
      }

      /**
       * Caches the Self-Check radios used by the visibility rules (they exist only after rows are built).
       * @returns {void}
       */
      cacheRowRadios () {
        this.elements.sc11No = getById('sc11_no');
        this.elements.sc11Yes = getById('sc11_yes');
        this.elements.sc9Yes = getById('sc9_yes');
      }

      /**
       * @returns {boolean} True when Self-Check question 1.11 is answered "No".
       */
      isSc11No () {
        return this.elements.sc11No?.checked ?? false;
      }

      /**
       * @returns {boolean} True when Self-Check question 1.9 is answered "Yes".
       */
      isSc9Yes () {
        return this.elements.sc9Yes?.checked ?? false;
      }

      /**
       * Tells whether any row in a section has the given answer.
       * @param {Element|null} rowsEl Container of the section's rows.
       * @param {'yes'|'no'|'na'} value Answer to look for.
       * @returns {boolean}
       */
      rowHasAnswer (rowsEl, value) {
        return !!rowsEl?.querySelector(`.check-row input[type="radio"][value="${value}"]:checked`);
      }

      /**
       * @returns {string|null} The active risk level ("low", "medium", "high"), or null.
       */
      getActiveRiskLevel () {
        for (const btn of this.elements.riskBtns) {
          if (btn.classList.contains('active')) return btn.dataset.risk ?? null;
        }
        return null;
      }

      /**
       * Copies a source input's value to linked inputs and clears the red "invalid" label color.
       * @param {HTMLInputElement} source Input being edited.
       * @param {...(HTMLInputElement|null)} targets Inputs to update.
       * @returns {void}
       */
      syncLinkedFields (source, ...targets) {
        const value = source.value;
        for (const field of targets) {
          if (field) field.value = value;
          field?.previousElementSibling?.removeAttribute('style');
        }
        source.previousElementSibling?.removeAttribute('style');
      }

      // ---------- Init ----------

      /**
       * Starts the form: builds rows (unless restored from a snapshot), binds events, sets initial state.
       * @returns {void}
       */
      init () {
        const hasPersistedRows = !!this.elements.scRows?.querySelector('.check-row');
        if (!hasPersistedRows) this.buildAllRows();
        else this.cacheRowRadios();

        // A saved snapshot opened from disk, or one that already has answers or a title, counts as restored.
        this.isRestored = !!(
          hasPersistedRows &&
          (window.location.protocol === 'file:' ||
            !!query('#check_form input[type="radio"]:checked') ||
            !!this.elements.workTitle?.value?.trim())
        );

        this.applyStaticLabels();
        this.#hydrateFormStateFromDom();
        this.attachEventListeners();
        this.#sig.init();
        this.#sig.refreshPreviews();
        this.updateRoleLabels(!this.isRestored);
        this.#comments.syncHeights();
        this.updateProgress();
        this.syncCssStateClasses();
      }

      /**
       * Attaches the delegated document listeners and the form submit listener.
       * @returns {void}
       */
      attachEventListeners () {
        document.addEventListener('click', this.#boundClick);
        document.addEventListener('change', this.#boundChange);
        document.addEventListener('input', this.#boundInput);
        document.addEventListener('keydown', this.#boundKeydown);
        document.addEventListener('focusin', this.#boundFocusin);
        document.addEventListener('pointerdown', this.#boundPointerdown);
        getById('check_form')?.addEventListener('submit', this.#boundSubmit);
      }

      // ---------- Build rows ----------

      /**
       * Builds the question rows for all five checklist sections.
       * @returns {void}
       */
      buildAllRows () {
        this.buildRows(this.elements.scRows, 'sc', CONFIG.SC_ITEMS, CONFIG.BINARY_QUESTIONS.sc);
        this.buildRows(this.elements.dsRows, 'ds', CONFIG.DS_ITEMS);
        this.buildRows(this.elements.chRows, 'ch', CONFIG.CH_ITEMS, CONFIG.BINARY_QUESTIONS.ch);
        this.buildRows(this.elements.prRows, 'pr', CONFIG.PR_ITEMS);
        this.buildRows(this.elements.irRows, 'ir', CONFIG.IR_ITEMS);
        this.cacheRowRadios();
      }

      /**
       * Builds the rows of one checklist section: number, text, Yes/No/N-A radios, notice area.
       * Radio names are `<prefix><n>` and lockControl `<prefix><n>_<value>` (for example "sc8_yes").
       * @param {Element|null} container Rows container.
       * @param {string} prefix Section prefix.
       * @param {string[]} items Question texts (HTML allowed, from trusted CONFIG).
       * @param {Set<number>} [binarySet] 1-based question numbers that only allow Yes / No.
       * @returns {void}
       */
      buildRows (container, prefix, items, binarySet = new Set()) {
        if (!container) return;
        const fragment = document.createDocumentFragment();
        const sectionNum = CONFIG.SECTION_NUM[prefix];
        /** Answer options; binary questions show a disabled blank N/A slot to keep the layout aligned. */
        const pillOptions = binary =>
          binary
            ? [
              ['yes', 'Yes'],
              ['no', 'No'],
              ['na', ' ', true],
            ]
            : [
              ['yes', 'Yes'],
              ['no', 'No'],
              ['na', 'N/A'],
            ];
        items.forEach((text, idx) => {
          const n = idx + 1;
          const isBinary = binarySet.has(n);
          const row = document.createElement('div');
          row.className = 'check-row';
          const numSpan = document.createElement('span');
          numSpan.className = 'check-num';
          numSpan.textContent = `${sectionNum}.${n}`;
          const textSpan = document.createElement('span');
          textSpan.className = 'check-text';
          textSpan.innerHTML = text;
          const pillGroup = document.createElement('div');
          pillGroup.className = `pill-group${isBinary ? ' pill-group--yes-no' : ''}`;
          const name = `${prefix}${n}`;
          pillOptions(isBinary).forEach(([value, labelText, disabled]) => {
            const id = `${name}_${value}`;
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = name;
            radio.id = id;
            radio.value = value;
            if (disabled) radio.disabled = true;
            const label = document.createElement('label');
            label.htmlFor = id;
            label.textContent = labelText;
            if (disabled) label.setAttribute('disabled', '');
            pillGroup.append(radio, label);
          });
          const noticeStack = document.createElement('div');
          noticeStack.className = 'row-notice-stack hidden';
          noticeStack.id = `${name}_notice_stack`;
          noticeStack.setAttribute('aria-live', 'polite');
          row.append(numSpan, textSpan, pillGroup, noticeStack);
          fragment.appendChild(row);
        });
        container.appendChild(fragment);
      }

      // ---------- Global delegated handlers ----------

      /**
       * Single click handler for the whole page (event delegation).
       * Order: signature tabs, open pad, clear preview, modal actions, section toggle,
       * risk buttons, registered buttons, then a visibility refresh.
       * @param {MouseEvent} e Click event.
       * @returns {void}
       */
      #handleClick (e) {
        const target = e.target;

        // Signature method tabs
        const tabBtn = target.closest('.btn-sig-tab');
        if (tabBtn) {
          e.preventDefault();
          this.#sig.setTab(tabBtn);
          return;
        }

        // Open signature modal
        const openBtn = target.closest('.btn-open-modal');
        if (openBtn) {
          e.preventDefault();
          if (openBtn.disabled || openBtn.getAttribute('aria-disabled') === 'true') return;
          const prefix = openBtn.dataset.prefix;
          if (prefix) this.#sig.open(prefix);
          return;
        }

        // Clear inline signature
        const clearInline = target.closest('.sig-draw-surface .image-thumbnail-remove');
        if (clearInline) {
          e.preventDefault();
          const prefix = clearInline.dataset.prefix;
          if (prefix) this.#sig.clearInline(prefix);
          return;
        }

        // Signature modal actions
        const action = target.closest('[data-action]')?.dataset.action;
        if (action === 'close-sig-modal') {
          e.preventDefault();
          this.#sig.close(false);
          return;
        }
        if (action === 'save-sig-modal') {
          e.preventDefault();
          this.#sig.close(true);
          return;
        }
        if (action === 'clear-sig-modal') {
          e.preventDefault();
          this.#sig.clearCanvas();
          return;
        }

        // Section header toggle (ignore clicks on interactive children)
        const head = target.closest('.sec-head');
        if (head?.hasAttribute('aria-controls')) {
          const interactive = target.closest(INTERACTIVE_SEL);
          if (!interactive || interactive === head) {
            e.preventDefault();
            this.toggleSection(head);
          }
        }

        // Risk level buttons
        const riskBtn = target.closest('.risk-btn');
        if (riskBtn) this.setRiskLevel(riskBtn.dataset.risk);

        // Registered action buttons
        const button = target.closest('button');
        const registered = button?.id ? this.#clickActions[button.id] : null;
        if (registered) registered(e);

        this.syncSectionVisibility();
      }

      /**
       * Delegated change handler: radio answers, field validity, check-level changes, comment editors.
       * @param {Event} e Change event.
       * @returns {void}
       */
      #handleChange (e) {
        const target = e.target;
        if (target.matches('input[type="radio"]')) this.#onRadioChange(target);
        if ((target.matches('input') || target.matches('select')) && target.validity.valid) {
          target.previousElementSibling?.removeAttribute('style');
          this.scheduleUpdateProgress();
        }
        if (target.id === 'minCheckLevel') this.syncSectionVisibility();
        this.#comments.handleFieldEvent(target);
      }

      /**
       * Delegated input handler: mirrors linked name fields and refreshes progress.
       * Name linking rules:
       *   - Engineer / Self-Check name are the same person unless Direct Supervision applies.
       *   - When Direct Supervision applies, the Self-Check name follows the Direct Supervisor field.
       *   - Checker name is always shared between Work Info and Section 3.
       * @param {Event} e Input event.
       * @returns {void}
       */
      #handleInput (e) {
        const target = e.target;
        if (LINKED_NAME_IDS.has(target.id)) {
          const showDs = this.isSc11No() || this.isEitRole();
          if ((target.id === 'engineer' || target.id === 'sc-name') && !showDs) {
            this.syncLinkedFields(target, this.elements.scName, this.elements.engineer);
          } else if ((target.id === 'direct-supervisor' || target.id === 'sc-name') && showDs) {
            this.syncLinkedFields(target, this.elements.scName, this.elements.directSuper);
          }
          // Checker name is always mirrored between Work Info and Section 3
          if (target.id === 'checker' || target.id === 'ch-name') {
            this.syncLinkedFields(target, this.elements.chName, this.elements.checker);
          }
        }
        if ((target.matches('input') || target.matches('select')) && target.validity.valid) {
          target.previousElementSibling?.removeAttribute('style');
          this.scheduleUpdateProgress();
        }
      }

      /**
       * Delegated keydown handler: Escape closes the signature modal; Enter / Space toggles a section header.
       * @param {KeyboardEvent} e Keydown event.
       * @returns {void}
       */
      #handleKeydown (e) {
        if (e.key === 'Escape' && this.#sig.isOpen()) {
          e.preventDefault();
          this.#sig.close(false);
          return;
        }
        const head = e.target.closest('.sec-head');
        if (head && (e.key === 'Enter' || e.key === ' ')) {
          // Let interactive children handle their own keys instead of toggling the section.
          const interactive = e.target.closest(INTERACTIVE_SEL);
          if (interactive && interactive !== head) return;
          e.preventDefault();
          head.click();
        }
      }

      /**
       * Reacts to a radio change: updates the answer cache, role labels, notices, and gating.
       * @param {HTMLInputElement} radio The radio that changed.
       * @returns {void}
       */
      #onRadioChange (radio) {
        const name = radio.name || '';
        const m = ROW_NAME_RE.exec(name);
        if (m) this.formState[m[1]][parseInt(m[2], 10)] = radio.value;

        if (name === 'sc11') this.updateRoleLabels(false);
        if (name === 'sc_role') this.updateRoleLabels(true);
        this.showRiskConsistencyNotices();
        if (name === 'ch_c' || name === 'pr_c' || name === 'ir_c') {
          const prefix = radio.dataset.prefix;
          if (prefix) this.#sig.updateGating(prefix);
          this.scheduleUpdateProgress();
          return;
        }
        this.syncSectionVisibility();
      }

      // ---------- Section toggle ----------

      /**
       * Expands or collapses a section and focuses its first control when expanding.
       * @param {HTMLElement} head The section header.
       * @returns {void}
       */
      toggleSection (head) {
        const body = getById(head.getAttribute('aria-controls'));
        const isExpanding = !head.classList.contains('open');
        head.classList.toggle('open');
        body?.classList.toggle('open');
        head.setAttribute('aria-expanded', head.classList.contains('open') ? 'true' : 'false');
        if (isExpanding && body) {
          const firstInput = body.querySelector('input:not([type="hidden"]), select, textarea, button:not(.btn-clear)');
          if (firstInput) setTimeout(() => firstInput.focus(), 50);
        }
      }

      // ---------- Risk ----------

      /**
       * Selects a risk level, sets the minimum check level it implies, and refreshes notices.
       * @param {string} level "low", "medium", or "high".
       * @returns {void}
       */
      setRiskLevel (level) {
        let activeBtn = null;
        this.elements.riskBtns.forEach(b => {
          const isActive = b.dataset.risk === level;
          b.classList.toggle('active', isActive);
          b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          if (isActive) activeBtn = b;
        });
        activeBtn?.parentElement?.previousElementSibling?.removeAttribute('style');
        const checkLevel = CONFIG.RISK_TO_CHECK_LEVEL[level];
        if (checkLevel) {
          this.elements.minCheckLevel.value = checkLevel;
          this.elements.minCheckLevel.dispatchEvent(new Event('change', { bubbles: true }));
        }
        this.showRiskConsistencyNotices();
        this.scheduleUpdateProgress();
      }

      // ---------- Notices ----------

      /**
       * Compares Self-Check answers with the chosen risk level and shows notices on rows 1.8 to 1.11.
       * Also sets `#inconsistent`, which blocks PDF export until the answers are corrected.
       * Rules:
       *   1.8 and 1.10 must match RISK_MAP for the active level (N/A is ignored).
       *   1.9 = Yes needs a Check and an Independent Structural Review, and cannot be Low risk.
       *   1.10 = Yes needs the High Risk Work Independent Review Record.
       *   1.11 = Yes is not allowed for an EIT; 1.11 = No means Direct Supervision is required.
       * @returns {void}
       */
      showRiskConsistencyNotices () {
        const sc = this.formState.sc;
        const isEit = this.isEitRole();
        const level = this.getActiveRiskLevel();
        const exp = level ? CONFIG.RISK_MAP[level] : null;
        /** Maps "yes"/"no" to display text. */
        const word = v => (v === 'yes' ? 'Yes' : 'No');
        /** Returns an error notice when question `n` disagrees with the risk level's expected answer. */
        const inconsistent = (n, key) =>
          exp && sc[n] && sc[n] !== 'na' && sc[n] !== exp[key]
            ? [
              {
                message: `<b>Correction required:</b> Not consistent with Risk Level (<b>${level.toUpperCase()}</b>).
          Expected <b>"${word(exp[key])}"</b>.`,
                type: 'error',
              },
            ]
            : [];

        this.renderNoticeStack('sc', 8, inconsistent(8, 'sc8'));
        this.#inconsistent = inconsistent(8, 'sc8').length > 0;

        const blocks9 = [];
        if (sc[9] === 'yes') {
          blocks9.push({
            message: `<b>Action required:</b> Question 1.9 is "Yes". The <b>POR</b> must complete the
          <b>Section 3 - Check</b> and the <b>Section 6 - Independent Structural Review</b>.`,
            type: 'warn',
          });
          if (level === 'low') {
            blocks9.push({
              message: `<b>Correction required:</b> This is a non-standard application -
          the Risk Level should <b>not</b> be <b>Low</b>.`,
              type: 'error',
            });
            this.#inconsistent = true;
          }
        }
        this.renderNoticeStack('sc', 9, blocks9);

        const blocks10 = inconsistent(10, 'sc10');
        if (sc[10] === 'yes') {
          blocks10.push({
            message: `<b>Action required:</b> Question 1.10 is "Yes". The <b>POR</b> must complete this
          check form and the <a
            href="https://hydroshare.bchydro.bc.ca/sites/engineering/HydroWeb%20Documents/Engineering%20Check%20%2526%20Review%20Documents/High-Risk%20Work%20Independent%20Review%20Record.docx?d=w510f42b3084f4baf87b203f351d13ca8"
            target="_blank" rel="noopener noreferrer"><strong>High Risk Work Independent Review Record</strong></a>.`,
            type: 'warn',
          });
        }
        this.renderNoticeStack('sc', 10, blocks10);

        const blocks11 = [];
        if (isEit && sc[11] === 'yes') {
          blocks11.push({
            message: `<b>Correction Required:</b> As an EIT for this work type, direct supervision from an
          experienced individual is required. Expected <b> "No" </b> for this question.`,
            type: 'error',
          });
          this.#inconsistent = true;
        }
        if (sc[11] === 'no') {
          blocks11.push({
            message: `<b>Action required:</b> Question 1.11 is "No". As an EIT/Unqualified Engineer for
          this work type, direct supervision is required. The <b>POR / Direct Supervisor</b> must also complete the
          <b>Section 2 - Direct Supervision</b>.`,
            type: 'warn',
          });
        }
        this.renderNoticeStack('sc', 11, blocks11);
      }

      /**
       * Renders notices under one checklist row. Skips the DOM write when the HTML is unchanged.
       * @param {string} prefix Section prefix.
       * @param {number} n 1-based question number.
       * @param {Array<{message: string, type?: 'warn'|'error'}>} blocks Notices to show.
       * @returns {void}
       */
      renderNoticeStack (prefix, n, blocks) {
        const stack = getById(`${prefix}${n}_notice_stack`);
        if (!stack) return;
        const html = (blocks ?? [])
          .map(
            ({ message, type = 'warn' }) => `
          <div class="notice row-notice ${type}">
            <span class="material-symbols-sharp">${type === 'error' ? 'error' : 'warning'}</span>
            <span>${message}</span>
          </div>`
          )
          .join('');
        if (this.#noticeCache.get(stack) === html) return;
        this.#noticeCache.set(stack, html);
        stack.innerHTML = html;
        stack.classList.toggle('hidden', !html);
      }

      // ---------- Section visibility ----------

      /**
       * Works out which sections to show from the current answers.
       * Rules:
       *   showDs      Direct Supervision: 1.11 is "No", or the role is EIT.
       *   showCheck   Check: minimum level is "Check", or risk is High.
       *   showPeer    Peer Review: any "No" in the Check, or a risk level is set, or the minimum
       *               level is Peer Review / Type 1 Independent Review.
       *   openS4      Open Peer Review: any "No" in the Check, or minimum level is Peer Review.
       *   openS5      Independent Review: 1.9 is "Yes" and risk is not Low.
       *   finalShown  Section 6: risk is High.
       * @returns {{showDs: boolean, showCheck: boolean, showPeer: boolean, openS4: boolean, openS5: boolean, showChNotice: boolean, finalShown: boolean}}
       */
      computeVisibilityState () {
        const isEit = this.isEitRole();
        const risk = this.getActiveRiskLevel();
        const isHighRisk = risk === 'high';
        const isLowRisk = risk === 'low';
        const minLevel = this.elements.minCheckLevel.value;
        const chHasNo = this.rowHasAnswer(this.elements.chRows, 'no');

        return {
          showDs: this.isSc11No() || isEit,
          showCheck: minLevel === 'Check' || isHighRisk,
          showPeer: chHasNo || !!risk || minLevel === 'Peer Review' || minLevel === 'Type 1 Independent Review Required',
          openS4: chHasNo || minLevel === 'Peer Review',
          openS5: !isLowRisk && this.isSc9Yes(),
          showChNotice: chHasNo,
          finalShown: isHighRisk,
        };
      }

      /**
       * Shows, hides, opens, and closes sections, and toggles required fields to match a state.
       * @param {ReturnType<CheckForm['computeVisibilityState']>} state Result of computeVisibilityState.
       * @returns {void}
       */
      applyVisibilityState (state) {
        const e = this.elements;
        e.chNotice.classList.toggle('hidden', !state.showChNotice);
        e.cardDs.classList.toggle('hidden', !state.showDs);
        e.cardCh.classList.toggle('hidden', !state.showCheck);

        this.setSectionOpen(e.s2Head, e.s2Body, state.showDs);
        this.setDirectSuperRequired(state.showDs);

        this.setSectionOpen(e.s3Head, e.s3Body, state.showCheck);
        this.setCheckerRequired(state.showCheck);

        e.cardPr.classList.toggle('hidden', !state.showPeer);
        // Once Peer Review is open it stays open, so a user is not shut out mid-edit.
        const shouldOpenPr = (e.s4Body?.classList.contains('open') ?? false) || state.openS4;
        this.setSectionOpen(e.s4Head, e.s4Body, shouldOpenPr);
        this.setRequired(e.cardPr, shouldOpenPr);

        e.cardFinal.classList.toggle('hidden', !state.finalShown);
        this.setSectionOpen(e.s6Head, e.s6Body, state.finalShown);
        this.setRequired(e.cardFinal, state.finalShown);

        e.cardIr.classList.toggle('hidden', !state.openS5);
        this.setSectionOpen(e.s5Head, e.s5Body, state.openS5);
        this.setRequired(e.cardIr, state.openS5);

        this.syncCssStateClasses();
        this.scheduleUpdateProgress();
      }

      /**
       * Recomputes and applies section visibility.
       * @returns {void}
       */
      syncSectionVisibility () {
        this.applyVisibilityState(this.computeVisibilityState());
      }

      /**
       * Opens or closes a section and updates aria-expanded.
       * @param {Element|null} head Section header.
       * @param {Element|null} body Section body.
       * @param {boolean} open Target state.
       * @returns {void}
       */
      setSectionOpen (head, body, open) {
        if (!head || !body) return;
        head.classList.toggle('open', open);
        body.classList.toggle('open', open);
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      /**
       * Makes an input required and enabled, or optional and disabled.
       * @param {Element|null} input Input element.
       * @param {boolean} required Target state.
       * @returns {void}
       */
      #setEnabledRequired (input, required) {
        if (!input) return;
        if (required) {
          input.setAttribute('required', '');
          input.removeAttribute('disabled');
        } else {
          input.removeAttribute('required');
          input.setAttribute('disabled', '');
        }
      }

      /**
       * Enables or disables the Direct Supervisor field.
       * @param {boolean} required True when Direct Supervision applies.
       * @returns {void}
       */
      setDirectSuperRequired (required) {
        this.#setEnabledRequired(this.elements.directSuper, required);
      }

      /**
       * Enables or disables the Checker field.
       * @param {boolean} required True when a Check applies.
       * @returns {void}
       */
      setCheckerRequired (required) {
        this.#setEnabledRequired(this.elements.checker, required);
      }

      /**
       * Makes the date and name inputs of a card required (or disabled).
       * @param {Element|null} element Card element.
       * @param {boolean} required Target state.
       * @returns {void}
       */
      setRequired (element, required) {
        element?.querySelectorAll(`input[id$='_date'], input[id$='_name']`).forEach(input => this.#setEnabledRequired(input, required));
      }

      // ---------- Role labels ----------

      /**
       * Applies labels that never change, once at startup.
       * @returns {void}
       */
      applyStaticLabels () {
        const e = this.elements;
        setText(e.scNameLabel, 'Professional of Record');
        setText(e.engineerResponseLabel, 'POR Response');
        setText(e.scSigLabel, 'Signature (POR)');
        setText(e.checkerLabel, 'Checker');
        if (e.checkerInput) e.checkerInput.placeholder = 'Checker name...';
        setText(e.chNameLabel, 'Name (Checker)');
        setText(e.chSigLabel, 'Signature (Checker)');
        setText(e.checkerCommentsLabel, 'Checker Comments & Corrections');
      }

      /**
       * Updates labels for the chosen role and, optionally, presets question 1.11.
       * An EIT always starts with 1.11 = "No" (direct supervision required).
       * @param {boolean} [resetSc11=true] True to reset the 1.11 answer to match the role.
       * @returns {void}
       */
      updateRoleLabels (resetSc11 = true) {
        const isEit = this.isEitRole();
        const { sc11No, sc11Yes, engLabel, engInput } = this.elements;
        if (resetSc11) {
          if (sc11No) sc11No.checked = isEit;
          if (sc11Yes) sc11Yes.checked = false;
          this.#hydrateFormStateFromDom();
        }
        setText(engLabel, isEit ? 'Engineer-in-Training' : 'Engineer');
        if (engInput) engInput.placeholder = isEit ? 'EIT name...' : 'Engineer name...';
        this.syncSectionVisibility();
      }

      // ---------- Progress ----------

      /**
       * Recalculates the progress bar, section badges, and the Save PDF "ready" state.
       *
       * Completion formula (over visible sections only):
       *   pct = round(answered / total * 100)
       * where `total` is the sum of question counts of visible sections and `answered` is the
       * sum of answered counts. Peer Review counts only after its first answer, because it is optional.
       * @returns {void}
       */
      updateProgress () {
        let total = 0;
        let answered = 0;
        const prAnswered = Object.keys(this.formState.pr).length > 0;

        this.sectionConfig.forEach(s => {
          const cnt = Object.keys(this.formState[s.prefix]).length;
          if (s.badge) s.badge.textContent = `${cnt} / ${s.count}`;
          if (s.num) {
            if (cnt === s.count) {
              s.num.classList.add('complete');
              s.num.innerHTML = '<span class="material-symbols-sharp"> check </span>';
            } else {
              s.num.classList.remove('complete');
              s.num.textContent = s.label;
            }
          }
          if (s.cardEl?.classList.contains('hidden')) return;
          // Peer review only counts once the user starts answering it
          if (s.prefix !== 'pr' || prAnswered) {
            total += s.count;
            answered += cnt;
          }
        });

        const pct = total ? Math.round((answered / total) * 100) : 0;
        const fullyComplete = pct === 100;
        this.elements.progressStrip.classList.toggle('complete', fullyComplete);
        this.elements.progressBar.value = pct;
        this.elements.progressPct.textContent = `${pct}`;

        this.elements.exportPdf?.classList.toggle(
          'complete',
          fullyComplete && this.allRequiredFieldsValid() && this.#sig.allOpenEnabled() && !this.#inconsistent
        );
      }

      /**
       * Debounces updateProgress by 50 ms so bursts of input cause one update.
       * @returns {void}
       */
      scheduleUpdateProgress () {
        if (this.#progressTimer) clearTimeout(this.#progressTimer);
        this.#progressTimer = setTimeout(() => {
          this.#progressTimer = null;
          this.updateProgress();
        }, 50);
      }

      // ---------- Validation ----------

      /**
       * Sets the screen-reader announcement text.
       * @param {string} msg Message.
       * @returns {void}
       */
      showValidationMessage (msg) {
        if (this.elements.validationAnnouncer) this.elements.validationAnnouncer.textContent = msg;
      }

      /**
       * Checks every required field. A field is valid when its underline would be hidden.
       * @param {boolean} [highlightInvalid=false] True to color the labels of invalid fields red.
       * @returns {boolean} True when all required fields are valid.
       */
      allRequiredFieldsValid (highlightInvalid = false) {
