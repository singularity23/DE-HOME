<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BC Hydro Distribution Engineering Check & Review Form">
  <title>Distribution Engineering Check Form</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23046a38'/><path d='M8 17l5.5 5.5L24 11' stroke='%23fff' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <!-- Quill CSS loaded on demand (lazy) -->

</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app"></div>
  <script>
    const DEBUG = true;
    const URL_PREFIX = 'https://hydroshare.bchydro.bc.ca'
    const LOCAL_PREFIX = 'D:/VS Code/Projects/DE Home/DE-HOME';
    const source = Object.freeze({
      FORM_CSS: '/sites/de/SiteAssets/css/check_form.css',
      FORM_JS: '/sites/de/SiteAssets/js/check_form.js'
    });

    const source_alt = Object.freeze(
      Object.fromEntries(
        Object.entries(source).map(([key, url]) => [key, DEBUG ? LOCAL_PREFIX + url : URL_PREFIX + url])
      )
    );

    function isLocal () {
      const { protocol, hostname } = window.location;

      // localhost / loopback
      const localHostnames = ['localhost', '127.0.0.1', '::1', '[::1]'];
      if (localHostnames.includes(hostname.toLowerCase())) return true;

      // 127.x.x.x range (all loopback)
      if (/^127(\.\d{1,3}){3}$/.test(hostname)) return true;

      // *.localhost (e.g. app.localhost) — per RFC 6761
      if (hostname.toLowerCase().endsWith('.localhost')) return true;

      return false;
    }

    console.log('source_to_use:', source_alt);

    window.addEventListener('DOMContentLoaded', async () => {

      const curLink = window.location.href;
      const source_to_use = DEBUG && isLocal() ? source : source_alt;
      const linkEl = document.createElement('link');
      linkEl.rel = 'stylesheet';
      linkEl.href = source_to_use.FORM_CSS;
      document.head.appendChild(linkEl);

      const scriptEl = document.createElement('script');
      scriptEl.src = source_to_use.FORM_JS;
      document.head.appendChild(scriptEl);

    });

  </script>
</body>

</html>
